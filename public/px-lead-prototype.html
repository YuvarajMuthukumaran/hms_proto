<body>
  <div id="__bundler_placeholder">Loading Tulasi · Patient Experience Lead...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ence view.<\/div>\n  <\/section>\n\n  <div class=\"utabs\" role=\"tablist\">\n    <sc-for list=\"{{recTabs}}\" as=\"t\" hint-placeholder-count=\"5\"><button class=\"{{t.cls}}\" type=\"button\" sc-camel-on-click=\"{{t.go}}\">{{t.label}}<\/button><\/sc-for>\n  <\/div>\n\n  <sc-if value=\"{{tabStay}}\" hint-placeholder-val=\"{{true}}\">\n    <section class=\"card\">\n      <div class=\"chead\"><h3>Stay steps<\/h3><span class=\"muted small\">Green done · amber due today · red overdue · grey upcoming<\/span><\/div>\n      <div class=\"scrollx\"><div class=\"steps\">\n        <sc-for list=\"{{sel.steps}}\" as=\"s\" hint-placeholder-count=\"9\">\n          <div class=\"{{s.cls}}\"><div class=\"sn\">{{s.name}}<\/div><div class=\"sw\">{{s.when}}<\/div><div><span class=\"{{s.chipCls}}\">{{s.statusLabel}}<\/span><\/div><div class=\"sw\">{{s.detail}}<\/div><\/div>\n        <\/sc-for>\n      <\/div><\/div>\n    <\/section>\n    <div class=\"cols\">\n      <section class=\"card\" style=\"flex:1 1 360px\">\n        <div class=\"chead\"><h3>Admission day checklist<\/h3><span class=\"chip grey\">{{sel.ckDone}} of {{sel.ckTotal}}<\/span><\/div>\n        <div>\n          <sc-for list=\"{{sel.checklist}}\" as=\"c\" hint-placeholder-count=\"7\">\n            <div class=\"checkrow\">\n              <button class=\"{{c.cls}}\" type=\"button\" sc-camel-on-click=\"{{c.toggle}}\" aria-label=\"Mark {{c.label}}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg><\/button>\n              <div class=\"grow\"><div class=\"name\">{{c.label}}<\/div><div class=\"muted small\">{{c.sub}}<\/div><\/div>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n      <\/section>\n      <section class=\"card\" style=\"flex:1 1 360px\">\n        <div class=\"chead\"><h3>Stay timeline<\/h3><\/div>\n        <div>\n          <sc-for list=\"{{sel.timeline}}\" as=\"l\" hint-placeholder-count=\"4\">\n            <div class=\"tl\"><div class=\"tld\">{{l.d}}<\/div><span class=\"tlm\" style=\"background:{{l.c}}\"><\/span><div class=\"grow\"><div class=\"name\">{{l.t}}<\/div><div class=\"muted small\">{{l.s}}<\/div><\/div><\/div>\n          <\/sc-for>\n        <\/div>\n      <\/section>\n    <\/div>\n  <\/sc-if>\n\n  <sc-if value=\"{{tabFamily}}\" hint-placeholder-val=\"{{false}}\">\n    <div class=\"cols\">\n      <section class=\"card\" style=\"flex:3 1 460px\">\n        <div class=\"chead\"><h3>Family contact log<\/h3><button class=\"btn sm pri\" type=\"button\" sc-camel-on-click=\"{{addCall}}\">Log a random call<\/button><\/div>\n        <div>\n          <sc-for list=\"{{sel.log}}\" as=\"l\" hint-placeholder-count=\"3\">\n            <div class=\"tl\"><div class=\"tld\">{{l.d}}<\/div><span class=\"tlm\" style=\"background:#1e6cdb\"><\/span><div class=\"grow\"><div class=\"name\">{{l.what}}<\/div><div class=\"muted small\">{{l.who}} · {{l.time}} · {{l.how}}<\/div><sc-if value=\"{{l.hasNote}}\" hint-placeholder-val=\"{{false}}\"><div class=\"small\" style=\"margin-top:4px\">{{l.note}}<\/div><\/sc-if><\/div><\/div>\n          <\/sc-for>\n          <sc-if value=\"{{sel.noLog}}\" hint-placeholder-val=\"{{false}}\"><div class=\"cpad muted\">No contact logged yet.<\/div><\/sc-if>\n        <\/div>\n      <\/section>\n      <section class=\"card\" style=\"flex:2 1 320px\">\n        <div class=\"chead\"><h3>Visits and outings<\/h3><span class=\"muted small\">Security sees this list<\/span><\/div>\n        <div>\n          <sc-for list=\"{{sel.visits}}\" as=\"v\" hint-placeholder-count=\"3\">\n            <div class=\"kvrow\"><div class=\"k\">{{v.k}}<\/div><div class=\"grow\">{{v.v}}<\/div><\/div>\n          <\/sc-for>\n        <\/div>\n      <\/section>\n    <\/div>\n  <\/sc-if>\n\n  <sc-if value=\"{{tabPrefs}}\" hint-placeholder-val=\"{{false}}\">\n    <div class=\"cols\">\n      <section class=\"card\" style=\"flex:1 1 380px\">\n        <div class=\"chead\"><h3>Preferences<\/h3><button class=\"btn sm\" type=\"button\">Edit<\/button><\/div>\n        <div class=\"muted small\" style=\"padding:10px 20px 0\">Shared by the care team. Nursing, kitchen and front desk can read this.<\/div>\n        <div style=\"padding-top:6px\">\n          <sc-for list=\"{{sel.prefs}}\" as=\"pf\" hint-placeholder-count=\"6\"><div class=\"kvrow\"><div class=\"k\">{{pf.k}}<\/div><div class=\"grow\">{{pf.v}}<\/div><\/div><\/sc-for>\n        <\/div>\n      <\/section>\n      <section class=\"card\" style=\"flex:1 1 380px\">\n        <div class=\"chead\"><h3>Belongings<\/h3><span class=\"muted small\">Logged at admission with front desk<\/span><\/div>\n        <div>\n          <sc-for list=\"{{sel.belongings}}\" as=\"b\" hint-placeholder-count=\"4\"><div class=\"kvrow\"><div class=\"k\">{{b.k}}<\/div><div class=\"grow\">{{b.v}}<\/div><\/div><\/sc-for>\n        <\/div>\n      <\/section>\n    <\/div>\n  <\/sc-if>\n\n  <sc-if value=\"{{tabConcerns}}\" hint-placeholder-val=\"{{false}}\">\n    <section class=\"card\">\n      <div class=\"chead\"><h3>Grievances for this stay<\/h3><button class=\"btn sm soft\" type=\"button\" sc-camel-on-click=\"{{openLog}}\">+ Log grievance<\/button><\/div>\n      <div>\n        <sc-for list=\"{{sel.concerns}}\" as=\"c\" hint-placeholder-count=\"2\">\n          <div class=\"listrow\"><span class=\"{{c.tyCls}}\" style=\"flex:0 0 90px\">{{c.typeLabel}}<\/span><div class=\"grow\"><div class=\"name\">{{c.title}}<\/div><div class=\"muted small\">{{c.raisedBy}} · {{c.owner}}<\/div><\/div><span class=\"{{c.slaCls}}\">{{c.slaText}}<\/span><button class=\"btn sm\" type=\"button\" sc-camel-on-click=\"{{c.open}}\">Open<\/button><\/div>\n        <\/sc-for>\n        <sc-if value=\"{{sel.noConcerns}}\" hint-placeholder-val=\"{{false}}\"><div class=\"cpad muted\">No grievances logged for this stay.<\/div><\/sc-if>\n      <\/div>\n    <\/section>\n  <\/sc-if>\n\n  <sc-if value=\"{{tabDischarge}}\" hint-placeholder-val=\"{{false}}\">\n    <section class=\"card\">\n      <div class=\"chead\"><div><h3>Discharge handoff<\/h3><span class=\"muted small\">Each team ticks its own step. You see the whole list.<\/span><\/div><button class=\"btn sm pri\" type=\"button\" sc-camel-on-click=\"{{openDcheck}}\">Open discharge checklist<\/button><\/div>\n      <div>\n        <sc-for list=\"{{sel.dischargeList}}\" as=\"c\" hint-placeholder-count=\"7\">\n          <div class=\"checkrow\">\n            <span class=\"{{c.dot}}\"><\/span>\n            <div class=\"grow\"><div class=\"name\">{{c.label}}<\/div><div class=\"muted small\">{{c.owner}}<\/div><\/div>\n            <span class=\"{{c.chip}}\">{{c.status}}<\/span>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/section>\n  <\/sc-if>\n<\/sc-if>\n\n<!-- ============ CONCERNS ============ -->\n<sc-if value=\"{{isConcerns}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"toolbar\">\n    <div class=\"seg\" role=\"tablist\">\n      <sc-for list=\"{{filters}}\" as=\"f\" hint-placeholder-count=\"5\"><button class=\"{{f.cls}}\" type=\"button\" sc-camel-on-click=\"{{f.go}}\">{{f.label}} <span class=\"n\">{{f.n}}<\/span><\/button><\/sc-for>\n    <\/div>\n    <button class=\"btn pri\" type=\"button\" sc-camel-on-click=\"{{openLog}}\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\/path><\/svg>Log a grievance<\/button>\n  <\/div>\n  <div class=\"cols\">\n    <section class=\"card\" style=\"flex:3 1 560px;overflow:hidden\">\n      <div class=\"scrollx\">\n        <sc-raw-table class=\"pt\">\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Type<\/sc-raw-th><sc-raw-th>Concern<\/sc-raw-th><sc-raw-th>Patient<\/sc-raw-th><sc-raw-th>Owner<\/sc-raw-th><sc-raw-th>Time left<\/sc-raw-th><sc-raw-th>Status<\/sc-raw-th><\/sc-raw-tr><\/sc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{concernRows}}\" as=\"c\" hint-placeholder-count=\"6\">\n              <sc-raw-tr class=\"{{c.rowCls}}\" style=\"{{c.sr}}\" sc-camel-on-click=\"{{c.open}}\">\n                <sc-raw-td><span class=\"{{c.tyCls}}\">{{c.typeLabel}}<\/span><div class=\"muted small\">{{c.id}}<\/div><\/sc-raw-td>\n                <sc-raw-td><div class=\"name\">{{c.title}}<\/div><div class=\"muted small\">{{c.category}} · {{c.raisedBy}}<\/div><\/sc-raw-td>\n                <sc-raw-td>{{c.patient}}<div class=\"muted small\">{{c.room}}<\/div><\/sc-raw-td>\n                <sc-raw-td>{{c.owner}}<div class=\"muted small\">{{c.ownerRole}}<\/div><\/sc-raw-td>\n                <sc-raw-td><span class=\"{{c.slaCls}}\">{{c.slaText}}<\/span><\/sc-raw-td>\n                <sc-raw-td><span class=\"{{c.statusCls}}\">{{c.status}}<\/span><\/sc-raw-td>\n              <\/sc-raw-tr>\n            <\/sc-for>\n          <\/sc-raw-tbody>\n        <\/sc-raw-table>\n      <\/div>\n    <\/section>\n    <section class=\"card\" style=\"flex:2 1 340px\">\n      <div class=\"chead\"><div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\"><span class=\"{{cur.tyCls}}\">{{cur.typeLabel}}<\/span><span class=\"{{cur.statusCls}}\">{{cur.status}}<\/span><span class=\"{{cur.slaCls}}\">{{cur.slaText}}<\/span><\/div><span class=\"muted small\">{{cur.id}}<\/span><\/div>\n      <div class=\"cpad\" style=\"display:flex;flex-direction:column;gap:14px\">\n        <div><h3 style=\"font-size:17px\">{{cur.title}}<\/h3><div class=\"muted small\" style=\"margin-top:4px\">Logged {{cur.logged}} · via {{cur.via}}<\/div><\/div>\n        <div class=\"kf\" style=\"margin-top:0\">\n          <div><div class=\"lbl\">Patient<\/div><div class=\"v\">{{cur.patient}}<\/div><\/div>\n          <div><div class=\"lbl\">Raised by<\/div><div class=\"v\">{{cur.raisedBy}}<\/div><\/div>\n          <div><div class=\"lbl\">Category<\/div><div class=\"v\">{{cur.category}}<\/div><\/div>\n          <div><div class=\"lbl\">Owner<\/div><div class=\"v\">{{cur.owner}}<\/div><div class=\"muted small\">{{cur.ownerRole}}<\/div><\/div>\n        <\/div>\n        <div><div class=\"lbl\" style=\"margin-bottom:4px\">What they said<\/div><div>{{cur.desc}}<\/div><\/div>\n        <sc-if value=\"{{cur.isOpen}}\" hint-placeholder-val=\"{{true}}\">\n          <div class=\"field\"><label for=\"resnote\">Resolution note<\/label><textarea id=\"resnote\" placeholder=\"What was done, and by whom\" value=\"{{resNote}}\" sc-camel-on-change=\"{{setResNote}}\"><\/textarea><\/div>\n          <div class=\"checkrow\" style=\"padding:0;border:0\"><button class=\"{{familyToldCls}}\" type=\"button\" sc-camel-on-click=\"{{toggleFamilyTold}}\" aria-label=\"Family told\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg><\/button><span>Family has been told how it was resolved<\/span><\/div>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><button class=\"btn pri sm\" type=\"button\" sc-camel-on-click=\"{{resolveCur}}\">Mark resolved<\/button><button class=\"btn sm\" type=\"button\" sc-camel-on-click=\"{{escalateCur}}\">Escalate to GM Ops (email S Chandra)<\/button><\/div>\n          <sc-if value=\"{{needFamilyTold}}\" hint-placeholder-val=\"{{false}}\"><div class=\"note\">Tell the family how it was resolved before you close it.<\/div><\/sc-if>\n        <\/sc-if>\n        <sc-if value=\"{{cur.isClosed}}\" hint-placeholder-val=\"{{false}}\"><div class=\"info\">{{cur.resolution}}<\/div><\/sc-if>\n      <\/div>\n    <\/section>\n  <\/div>\n<\/sc-if>\n\n<!-- ============ FLOOR ROUND ============ -->\n<sc-if value=\"{{isFloor}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"hello\">\n    <div><h2>Floor round<\/h2><div class=\"muted\">Walk each floor once a day. An issue goes straight to the team that owns it, with a due time.<\/div><\/div>\n    <div class=\"seg\" role=\"tablist\"><sc-for list=\"{{floorSegs}}\" as=\"g\" hint-placeholder-count=\"3\"><button class=\"{{g.cls}}\" type=\"button\" sc-camel-on-click=\"{{g.go}}\">{{g.label}} <span class=\"n\">{{g.n}}<\/span><\/button><\/sc-for><\/div>\n  <\/div>\n  <div class=\"cols\">\n    <section class=\"card\" style=\"flex:3 1 540px;overflow:hidden\">\n      <div class=\"chead\"><h3>{{floorName}} round<\/h3><span class=\"muted small\">Once a day<\/span><\/div>\n      <div class=\"fr-top\"><div class=\"fr-head\"><div class=\"fr-read\"><b>{{floorDone}}<\/b><em>of {{floorTotal}} checked<\/em><\/div><div class=\"fr-tally\"><span class=\"t-ok\">{{floorOk}} OK<\/span><span class=\"t-is\">{{floorIssues}} {{floorIssueWord}}<\/span><span>{{floorLeft}} to check<\/span><\/div><\/div><div class=\"fr-walk\" aria-hidden=\"true\"><sc-for list=\"{{floorStrip}}\" as=\"z\" hint-placeholder-count=\"8\"><i class=\"{{z.cls}}\"><\/i><\/sc-for><\/div><\/div>\n      <sc-for list=\"{{floorGroups}}\" as=\"g\" hint-placeholder-count=\"3\">\n        <div class=\"fr-group\">\n          <div class=\"fr-gh\"><span>{{g.title}}<\/span><em>{{g.progress}}<\/em><\/div>\n          <sc-for list=\"{{g.items}}\" as=\"f\" hint-placeholder-count=\"3\">\n            <div class=\"{{f.rowCls}}\">\n              <div class=\"fr-state\" aria-hidden=\"true\"><\/div>\n              <div class=\"fr-txt\"><div class=\"name\">{{f.label}}<\/div><div class=\"fr-own\">If not OK: {{f.owner}}<\/div><\/div>\n              <div class=\"fr-tog\" role=\"group\" aria-label=\"{{f.label}}\"><button class=\"{{f.okCls}}\" type=\"button\" sc-camel-on-click=\"{{f.ok}}\">OK<\/button><button class=\"{{f.isCls}}\" type=\"button\" sc-camel-on-click=\"{{f.issue}}\">Issue<\/button><\/div>\n              <div class=\"fr-extra\"><div><span class=\"fr-due\">Goes to {{f.owner}}, due in 4 hours<\/span><input aria-label=\"What is wrong: {{f.label}}\" placeholder=\"What did you see? (optional)\" value=\"{{f.note}}\" sc-camel-on-change=\"{{f.setNote}}\"><\/div><\/div>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n      <\/sc-for>\n      <div class=\"fr-foot\"><button class=\"btn pri\" type=\"button\" sc-camel-on-click=\"{{finishRound}}\">Finish round<\/button><span class=\"muted small\">{{roundNote}}<\/span><\/div>\n      <sc-if value=\"{{roundDone}}\" hint-placeholder-val=\"{{false}}\"><div class=\"fr-done\">{{roundDoneText}}<\/div><\/sc-if>\n    <\/section>\n    <section class=\"card\" style=\"flex:2 1 340px;align-self:flex-start;position:sticky;top:12px\">\n      <div class=\"chead\"><h3>Who owns what on the floor<\/h3><span class=\"muted small\">On shift today<\/span><\/div>\n      <div>\n        <sc-for list=\"{{owners}}\" as=\"o\" hint-placeholder-count=\"10\">\n          <div class=\"listrow\" style=\"padding:11px 20px\"><div class=\"avatar av-tint\" style=\"width:32px;height:32px;font-size:11px\">{{o.ini}}<\/div><div class=\"grow\"><div class=\"name\">{{o.role}}<\/div><div class=\"muted small\">{{o.who}} · {{o.what}}<\/div><\/div><\/div>\n        <\/sc-for>\n      <\/div>\n    <\/section>\n  <\/div>\n<\/sc-if>\n\n<!-- ============ DISCHARGE FEEDBACK (FORM 6) ============ -->\n<sc-if value=\"{{isFeedback}}\" hint-placeholder-val=\"{{false}}\">\n  <section class=\"card\">\n    <div class=\"chead\"><div><h3>IPD Patient &amp; Family Feedback Form<\/h3><div class=\"muted small\">Tulasi Healthcare Hospital · Form 6. Fill it in with the family on the discharge call. All responses are kept confidential.<\/div><\/div><span class=\"chip amber\">2 waiting<\/span><\/div>\n    <div class=\"cpad\" style=\"display:flex;flex-direction:column;gap:18px\">\n      <div><div class=\"lbl\" style=\"margin-bottom:8px\">A. Patient &amp; respondent details<\/div>\n        <div class=\"fgrid\">\n          <div class=\"field\"><label for=\"fbp\">Patient<\/label><sc-raw-select id=\"fbp\" value=\"{{fb.pid}}\" sc-camel-on-change=\"{{setFbPid}}\"><sc-for list=\"{{fbPatients}}\" as=\"o\" hint-placeholder-count=\"5\"><option value=\"{{o.id}}\">{{o.label}}<\/option><\/sc-for><\/sc-raw-select><\/div>\n          <div class=\"field\"><label for=\"fbu\">UHID / Patient ID<\/label><input id=\"fbu\" placeholder=\"e.g. 2026-27RG6905\" value=\"{{fb.uhid}}\" sc-camel-on-change=\"{{setFbUhid}}\"><\/div>\n          <div class=\"field\"><label>Date of discharge<\/label><div class=\"info\" style=\"margin:0\">{{fbSel.discharged}}<\/div><\/div>\n          <div class=\"field\"><label>Treating doctor<\/label><div class=\"info\" style=\"margin:0\">{{fbSel.doctor}}<\/div><\/div>\n          <div class=\"field\"><label for=\"fbw\">Ward / floor<\/label><input id=\"fbw\" placeholder=\"e.g. Floor 2\" value=\"{{fb.ward}}\" sc-camel-on-change=\"{{setFbWard}}\"><\/div>\n          <div class=\"field\"><label for=\"fbr\">Respondent is<\/label><sc-raw-select id=\"fbr\" value=\"{{fb.who}}\" sc-camel-on-change=\"{{setFbWho}}\"><option>Patient (self)<\/option><option>Parent<\/option><option>Spouse<\/option><option>Sibling<\/option><option>Guardian<\/option><option>Other<\/option><\/sc-raw-select><\/div>\n        <\/div>\n      <\/div>\n      <div><div class=\"lbl\" style=\"margin-bottom:8px\">B. Overall recommendation<\/div>\n        <div class=\"name\" style=\"margin-bottom:8px\">How likely are you to recommend Tulasi Healthcare Hospital to another family?<\/div>\n        <div class=\"nps\"><sc-for list=\"{{npsBtns}}\" as=\"b\" hint-placeholder-count=\"11\"><button class=\"{{b.cls}}\" type=\"button\" sc-camel-on-click=\"{{b.pick}}\" aria-label=\"Score {{b.n}}\">{{b.n}}<\/button><\/sc-for><\/div>\n        <div class=\"muted small\" style=\"margin-top:6px\">0 to 6 not likely to recommend · 7 to 8 likely · 9 to 10 very likely to recommend<\/div>\n      <\/div>\n      <div><div class=\"lbl\" style=\"margin-bottom:4px\">C. Rate the following (1 = Poor, 5 = Excellent)<\/div>\n        <sc-for list=\"{{rateRows}}\" as=\"r\" hint-placeholder-count=\"6\"><div class=\"rate\"><span>{{r.label}}<\/span><div style=\"display:flex;gap:4px\"><sc-for list=\"{{r.btns}}\" as=\"s\" hint-placeholder-count=\"5\"><button class=\"{{s.cls}}\" type=\"button\" sc-camel-on-click=\"{{s.pick}}\" aria-label=\"{{r.label}} {{s.n}} of 5\">{{s.n}}<\/button><\/sc-for><\/div><\/div><\/sc-for>\n      <\/div>\n      <div><div class=\"lbl\" style=\"margin-bottom:8px\">D. In your own words<\/div>\n        <div class=\"fgrid\">\n          <div class=\"field\"><label for=\"fb1\">What helped your family most during the stay?<\/label><textarea id=\"fb1\" placeholder=\"In their words\" value=\"{{fb.helped}}\" sc-camel-on-change=\"{{setFbHelped}}\"><\/textarea><\/div>\n          <div class=\"field\"><label for=\"fb2\">What could we have done better?<\/label><textarea id=\"fb2\" placeholder=\"In their words\" value=\"{{fb.better}}\" sc-camel-on-change=\"{{setFbBetter}}\"><\/textarea><\/div>\n        <\/div>\n      <\/div>\n      <div><div class=\"lbl\" style=\"margin-bottom:8px\">E. Stay in touch<\/div>\n        <div class=\"name\" style=\"margin-bottom:8px\">May we call you in 2 weeks to check in on your family member's recovery?<\/div>\n        <div class=\"seg\" style=\"margin-bottom:10px\"><sc-for list=\"{{callBtns}}\" as=\"b\" hint-placeholder-count=\"2\"><button class=\"{{b.cls}}\" type=\"button\" sc-camel-on-click=\"{{b.pick}}\">{{b.label}}<\/button><\/sc-for><\/div>\n        <sc-if value=\"{{fbCallYes}}\" hint-placeholder-val=\"{{true}}\"><div class=\"fgrid\">\n          <div class=\"field\"><label for=\"fbm\">Best mobile number to call<\/label><input id=\"fbm\" placeholder=\"+91\" value=\"{{fb.mobile}}\" sc-camel-on-change=\"{{setFbMobile}}\"><\/div>\n          <div class=\"field\"><label for=\"fbt\">Best time<\/label><input id=\"fbt\" placeholder=\"e.g. after 5 pm\" value=\"{{fb.time}}\" sc-camel-on-change=\"{{setFbTime}}\"><\/div>\n        <\/div><\/sc-if>\n      <\/div>\n      <div><div class=\"lbl\" style=\"margin-bottom:8px\">F. For office use only<\/div>\n        <div class=\"fgrid\">\n          <div class=\"fiel reating psychiatrist<\/label><input value=\"{{dcf.doctor}}\" readonly=\"readonly\"><\/div>\n        <div class=\"fgrid\"><div class=\"field\"><label for=\"dcdd\">Date<\/label><input id=\"dcdd\" type=\"date\" value=\"{{dcf.docDate}}\" sc-camel-on-change=\"{{dcf.setDocDate}}\"><\/div><div class=\"field\"><label for=\"dcdt\">Time<\/label><input id=\"dcdt\" type=\"time\" value=\"{{dcf.docTime}}\" sc-camel-on-change=\"{{dcf.setDocTime}}\"><\/div><\/div>\n        <div class=\"field\"><label>Treating psychologist<\/label><input value=\"{{dcf.psych}}\" readonly=\"readonly\"><\/div>\n        <div class=\"fgrid\"><div class=\"field\"><label for=\"dcpd\">Date<\/label><input id=\"dcpd\" type=\"date\" value=\"{{dcf.psyDate}}\" sc-camel-on-change=\"{{dcf.setPsyDate}}\"><\/div><div class=\"field\"><label for=\"dcpt\">Time<\/label><input id=\"dcpt\" type=\"time\" value=\"{{dcf.psyTime}}\" sc-camel-on-change=\"{{dcf.setPsyTime}}\"><\/div><\/div>\n      <\/div>\n      <sc-for list=\"{{dcf.gaps}}\" as=\"m\" hint-placeholder-count=\"1\">\n        <div class=\"note dc-gap\"><span><b>{{m.who}}<\/b> has not filled the follow-up date. Ask before the family leaves (SOP step 3).<\/span><span style=\"display:flex;gap:8px;flex-wrap:wrap\"><button class=\"{{m.remCls}}\" type=\"button\" sc-camel-on-click=\"{{m.remind}}\">{{m.remLabel}}<\/button><button class=\"{{m.cntCls}}\" type=\"button\" sc-camel-on-click=\"{{m.count}}\">{{m.cntLabel}}<\/button><\/span><\/div>\n      <\/sc-for>\n      <div class=\"fgrid\">\n        <div class=\"field\"><label for=\"dcas\">Follow-up calls assigned to<\/label><sc-raw-select id=\"dcas\" value=\"{{dcf.assigned}}\" sc-camel-on-change=\"{{dcf.setAssigned}}\"><option>Khalid (call centre)<\/option><option>Kanika (patient experience)<\/option><option>Prabh (patient experience)<\/option><\/sc-raw-select><\/div>\n        <div class=\"field\"><label>Family agrees to the Day-14 and Day-30 calls<\/label><div class=\"seg\"><sc-for list=\"{{dcf.consentBtns}}\" as=\"b\" hint-placeholder-count=\"2\"><button class=\"{{b.cls}}\" type=\"button\" sc-camel-on-click=\"{{b.pick}}\">{{b.label}}<\/button><\/sc-for><\/div><\/div>\n        <div class=\"field\"><label for=\"dccn\">Family contact for the calls<\/label><input id=\"dccn\" placeholder=\"Name\" value=\"{{dcf.cName}}\" sc-camel-on-change=\"{{dcf.setCName}}\"><\/div>\n        <div class=\"fgrid\"><div class=\"field\"><label for=\"dccr\">Relation<\/label><input id=\"dccr\" placeholder=\"e.g. Father\" value=\"{{dcf.cRel}}\" sc-camel-on-change=\"{{dcf.setCRel}}\"><\/div><div class=\"field\"><label for=\"dccp\">Mobile<\/label><input id=\"dccp\" placeholder=\"Mobile number\" value=\"{{dcf.cPhone}}\" sc-camel-on-change=\"{{dcf.setCPhone}}\"><\/div><\/div>\n      <\/div>\n    <\/div>\n    <div>\n      <sc-for list=\"{{dcf.items}}\" as=\"c\" hint-placeholder-count=\"4\">\n        <div class=\"{{c.rowCls}}\">\n          <button class=\"{{c.cls}}\" type=\"button\" sc-camel-on-click=\"{{c.toggle}}\" aria-label=\"Mark {{c.label}}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg><\/button>\n          <div class=\"grow\"><div class=\"name\">{{c.label}}<\/div><div class=\"muted small\">{{c.sub}}<\/div><\/div>\n          <sc-if value=\"{{c.hasTag}}\" hint-placeholder-val=\"{{false}}\"><span class=\"{{c.tagCls}}\">{{c.tag}}<\/span><\/sc-if>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n  <\/section>\n\n  <div class=\"dc-grid\">\n  <sc-for list=\"{{dcSecB}}\" as=\"g\" hint-placeholder-count=\"2\">\n    <section class=\"card\">\n      <div class=\"chead\"><div><h3>{{g.title}}<\/h3><div class=\"muted small\">{{g.owner}}<\/div><\/div><span class=\"{{g.chip}}\">{{g.progress}}<\/span><\/div>\n      <sc-if value=\"{{g.isRisk}}\" hint-placeholder-val=\"{{false}}\"><div class=\"dc-risk\"><span class=\"name\">Risk level<\/span><div class=\"seg\"><sc-for list=\"{{g.riskBtns}}\" as=\"b\" hint-placeholder-count=\"3\"><button class=\"{{b.cls}}\" type=\"button\" sc-camel-on-click=\"{{b.pick}}\">{{b.label}}<\/button><\/sc-for><\/div><span class=\"muted small\">{{g.riskHint}}<\/span><\/div><\/sc-if>\n      <div>\n        <sc-for list=\"{{g.items}}\" as=\"c\" hint-placeholder-count=\"5\">\n          <div class=\"{{c.rowCls}}\">\n            <button class=\"{{c.cls}}\" type=\"button\" sc-camel-on-click=\"{{c.toggle}}\" aria-label=\"Mark {{c.label}}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg><\/button>\n            <div class=\"grow\"><div class=\"name\">{{c.label}}<\/div><div class=\"muted small\">{{c.sub}}<\/div><\/div>\n            <sc-if value=\"{{c.hasTag}}\" hint-placeholder-val=\"{{false}}\"><span class=\"{{c.tagCls}}\">{{c.tag}}<\/span><\/sc-if>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/section>\n  <\/sc-for>\n  <\/div>\n\n  <section class=\"card\">\n    <div class=\"chead\"><div><h3>Sign-off<\/h3><div class=\"muted small\">The patient does not leave until every must-do item is done and all three have signed.<\/div><\/div><span class=\"{{dcSignChip}}\">{{dcSignText}}<\/span><\/div>\n    <div class=\"dc-sigs\">\n      <sc-for list=\"{{dcSigns}}\" as=\"g\" hint-placeholder-count=\"3\">\n        <div class=\"dc-sig\">\n          <div class=\"lbl\" style=\"padding:0\">{{g.role}}<\/div>\n          <div class=\"muted small\">{{g.says}}<\/div>\n          <div class=\"field\"><input aria-label=\"{{g.role}} name\" placeholder=\"Name\" value=\"{{g.name}}\" sc-camel-on-change=\"{{g.setName}}\"><\/div>\n          <button class=\"{{g.btnCls}}\" type=\"button\" sc-camel-on-click=\"{{g.sign}}\">{{g.btnLabel}}<\/button>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n    <div class=\"cpad\" style=\"border-top:1px solid #eef2f6;display:flex;flex-direction:column;gap:10px\">\n      <sc-if value=\"{{dcDone}}\" hint-placeholder-val=\"{{false}}\"><div class=\"info\">{{dcDoneText}}<\/div><div><button class=\"btn\" type=\"button\" sc-camel-on-click=\"{{goFollow}}\">Open follow-ups<\/button><\/div><\/sc-if>\n      <sc-if value=\"{{dcOpen}}\" hint-placeholder-val=\"{{true}}\">\n        <div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap\"><button class=\"btn pri\" type=\"button\" sc-camel-on-click=\"{{dcComplete}}\">Complete discharge<\/button><span class=\"muted small\">{{dcHint}}<\/span><\/div>\n        <sc-if value=\"{{dcShowBlocks}}\" hint-placeholder-val=\"{{false}}\"><div class=\"note\"><b>Still to do before the family leaves:<\/b><sc-for list=\"{{dcBlocks}}\" as=\"b\" hint-placeholder-count=\"3\"><div>· {{b.t}}<\/div><\/sc-for><\/div><\/sc-if>\n      <\/sc-if>\n    <\/div>\n  <\/section>\n<\/sc-if>\n\n<!-- ============ FOLLOW-UPS ============ -->\n<sc-if value=\"{{isFollow}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"hello\">\n    <div><h2>Follow-ups after discharge<\/h2><div class=\"muted\">Built from the discharge checklists. Replaces the \"Follow-up tomorrow\" messages typed into the call-centre group.<\/div><\/div>\n  <\/div>\n  <div class=\"tiles\">\n    <sc-for list=\"{{fuTiles}}\" as=\"t\" hint-placeholder-count=\"5\"><div class=\"tile\"><span class=\"lbl\">{{t.label}}<\/span><b>{{t.value}}<\/b><span class=\"muted small\">{{t.sub}}<\/span><\/div><\/sc-for>\n  <\/div>\n  <div class=\"cols\">\n    <section class=\"card\" style=\"flex:2 1 360px\">\n      <div class=\"chead\"><div><h3>Tomorrow's list for the call centre<\/h3><div class=\"muted small\">{{fuMsgSub}}<\/div><\/div><span class=\"{{fuPostChip}}\">{{fuPostText}}<\/span><\/div>\n      <div class=\"cpad\" style=\"display:flex;flex-direction:column;gap:12px\">\n        <sc-if value=\"{{fuHasTomorrow}}\" hint-placeholder-val=\"{{true}}\"><div class=\"fu-msg\">{{fuTomorrowText}}<\/div><\/sc-if>\n        <sc-if value=\"{{fuNo
