<body>
  <div id="__bundler_placeholder">Loading Tulasi · Patient Experience Lead...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

       <\/sc-for>\n        <\/div>\n      <\/section>\n    <\/div>\n  <\/div>\n<\/sc-if>\n\n<!-- ============ STAYS LIST ============ -->\n<sc-if value=\"{{isStays}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"toolbar\">\n    <div class=\"seg\" role=\"tablist\">\n      <sc-for list=\"{{staySegs}}\" as=\"g\" hint-placeholder-count=\"3\"><button class=\"{{g.cls}}\" type=\"button\" sc-camel-on-click=\"{{g.go}}\">{{g.label}} <span class=\"n\">{{g.n}}<\/span><\/button><\/sc-for>\n    <\/div>\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\"><input class=\"search\" type=\"search\" placeholder=\"Type a name\" aria-label=\"Search patients\"><\/div>\n  <\/div>\n  <section class=\"card\" style=\"overflow:hidden\">\n    <div class=\"scrollx\">\n      <sc-raw-table class=\"pt\">\n        <sc-raw-thead><sc-raw-tr><sc-raw-th>Patient<\/sc-raw-th><sc-raw-th>Stay steps<\/sc-raw-th><sc-raw-th>Reminders<\/sc-raw-th><sc-raw-th><\/sc-raw-th><\/sc-raw-tr><\/sc-raw-thead>\n        <sc-raw-tbody>\n          <sc-for list=\"{{stayRows}}\" as=\"p\" hint-placeholder-count=\"6\">\n            <sc-raw-tr class=\"ck\" style=\"{{p.sr}}\" sc-camel-on-click=\"{{p.open}}\">\n              <sc-raw-td><div class=\"prow\"><div class=\"{{p.avCls}}\" style=\"width:38px;height:38px;font-size:13px\">{{p.ini}}<\/div><div><div style=\"display:flex;gap:6px;align-items:center\"><span class=\"name\">{{p.name}}<\/span><sc-if value=\"{{p.hasTag}}\" hint-placeholder-val=\"{{false}}\"><span class=\"{{p.tagCls}}\">{{p.tag}}<\/span><\/sc-if><\/div><div class=\"pmeta\">Day {{p.day}} · {{p.room}} · {{p.doctor}}<\/div><\/div><\/div><\/sc-raw-td>\n              <sc-raw-td><div class=\"prog\"><div class=\"ph\"><span>{{p.doneN}} of 9 done<\/span><\/div><div class=\"bar\"><i style=\"width:{{p.pct}}\"><\/i><\/div><div class=\"muted small\">Next: {{p.next}}<\/div><\/div><\/sc-raw-td>\n              <sc-raw-td><div class=\"due rm\"><sc-for list=\"{{p.due}}\" as=\"d\" hint-placeholder-count=\"2\"><div class=\"rm-r\"><span class=\"{{d.dot}}\"><\/span><span class=\"rm-t\"><span class=\"name\">{{d.t}}<\/span><br><span class=\"muted small\">{{d.s}}<\/span><\/span><sc-if value=\"{{d.hasBtn}}\" hint-placeholder-val=\"{{false}}\"><button class=\"{{d.btnCls}}\" type=\"button\" sc-camel-on-click=\"{{d.act}}\">{{d.btnLabel}}<\/button><\/sc-if><\/div><\/sc-for><sc-if value=\"{{p.noDue}}\" hint-placeholder-val=\"{{false}}\"><span class=\"muted small\">Nothing to remind anyone about<\/span><\/sc-if><\/div><\/sc-raw-td>\n              <sc-raw-td class=\"open-c\"><button class=\"open-lnk\" type=\"button\" sc-camel-on-click=\"{{p.open}}\">Open record<svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\/path><\/svg><\/button><\/sc-raw-td>\n            <\/sc-raw-tr>\n          <\/sc-for>\n        <\/sc-raw-tbody>\n      <\/sc-raw-table>\n    <\/div>\n  <\/section>\n<\/sc-if>\n\n<!-- ============ PATIENT RECORD ============ -->\n<sc-if value=\"{{isRecord}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"toolbar\">\n    <div class=\"crumb\"><button class=\"btn sm link\" type=\"button\" sc-camel-on-click=\"{{goStays}}\">Patient experience<\/button>/<span>Stays<\/span>/<b>{{sel.name}}<\/b><\/div>\n    <div style=\"display:flex;gap:10px;align-items:center\"><span class=\"muted small\">Patient {{sel.idx}} of {{patientCount}}<\/span><button class=\"btn sm link\" type=\"button\" sc-camel-on-click=\"{{nextPatient}}\">{{nextName}} ›<\/button><\/div>\n  <\/div>\n  <section class=\"card shb\">\n    <div class=\"hdr\">\n      <div style=\"display:flex;flex-direction:column;gap:14px;flex:1 1 420px;min-width:0\">\n        <div class=\"idr\">\n          <div class=\"avatar av-ink\" style=\"width:54px;height:54px;font-size:15px\">{{sel.ini}}<\/div>\n          <div>\n            <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\"><span class=\"nm\">{{sel.name}}<\/span><sc-if value=\"{{sel.vip}}\" hint-placeholder-val=\"{{false}}\"><span class=\"tag t-vip\">VIP<\/span><\/sc-if><sc-if value=\"{{sel.isNew}}\" hint-placeholder-val=\"{{false}}\"><span class=\"tag t-new\">New<\/span><\/sc-if><\/div>\n            <div class=\"pmeta\">{{sel.room}} · UHID {{sel.uhid}} · Day {{sel.day}}<\/div>\n          <\/div>\n        <\/div>\n        <div class=\"team\">\n          <span class=\"lbl\">Treating team<\/span>\n          <div class=\"prow\"><div class=\"avatar av-tint\" style=\"width:30px;height:30px;font-size:11px\">{{sel.docIni}}<\/div><div><div class=\"name small\">{{sel.doctor}}<\/div><div class=\"muted small\">Psychiatrist<\/div><\/div><\/div>\n          <div class=\"prow\"><div class=\"avatar av-violet\" style=\"width:30px;height:30px;font-size:11px\">{{sel.psyIni}}<\/div><div><div class=\"name small\">{{sel.psych}}<\/div><div class=\"muted small\">Psychologist<\/div><\/div><\/div>\n        <\/div>\n      <\/div>\n      <div class=\"act\">\n        <button class=\"btn pri\" type=\"button\">Call family<\/button>\n        <button class=\"btn\" type=\"button\">Message family<\/button>\n        <button class=\"btn soft\" type=\"button\" sc-camel-on-click=\"{{openLog}}\">+ Log grievance<\/button>\n      <\/div>\n    <\/div>\n    <div class=\"kf\">\n      <div><div class=\"lbl\">Admitted<\/div><div class=\"v\">{{sel.admitted}}<\/div><div class=\"muted small\">{{sel.admType}}<\/div><\/div>\n      <div><div class=\"lbl\">Nominated representative<\/div><div class=\"v\">{{sel.nr}}<\/div><div class=\"muted small\">Can receive updates<\/div><\/div>\n      <div><div class=\"lbl\">Family contact<\/div><div class=\"v\">{{sel.guardian}}<\/div><div class=\"muted small\">{{sel.phone}}<\/div><\/div>\n      <div><div class=\"lbl\">Expected discharge<\/div><div class=\"v\">{{sel.discharge}}<\/div><div class=\"muted small\">Set by psychiatrist<\/div><\/div>\n    <\/div>\n    <div class=\"muted small\" style=\"margin-top:14px\">Diagnosis, notes and medicines are not shown in the patient experience view.<\/div>\n  <\/section>\n\n  <div class=\"utabs\" role=\"tablist\">\n    <sc-for list=\"{{recTabs}}\" as=\"t\" hint-placeholder-count=\"5\"><button class=\"{{t.cls}}\" type=\"button\" sc-camel-on-click=\"{{t.go}}\">{{t.label}}<\/button><\/sc-for>\n  <\/div>\n\n  <sc-if value=\"{{tabStay}}\" hint-placeholder-val=\"{{true}}\">\n    <section class=\"card\">\n      <div class=\"chead\"><h3>Stay steps<\/h3><span class=\"muted small\">Green done · amber due today · red overdue · grey upcoming<\/span><\/div>\n      <div class=\"scrollx\"><div class=\"steps\">\n        <sc-for list=\"{{sel.steps}}\" as=\"s\" hint-placeholder-count=\"9\">\n          <div class=\"{{s.cls}}\"><div class=\"sn\">{{s.name}}<\/div><div class=\"sw\">{{s.when}}<\/div><div><span class=\"{{s.chipCls}}\">{{s.statusLabel}}<\/span><\/div><div class=\"sw\">{{s.detail}}<\/div><\/div>\n        <\/sc-for>\n      <\/div><\/div>\n    <\/section>\n    <div class=\"cols\">\n      <section class=\"card\" style=\"flex:1 1 360px\">\n        <div class=\"chead\"><h3>Admission day checklist<\/h3><span class=\"chip grey\">{{sel.ckDone}} of {{sel.ckTotal}}<\/span><\/div>\n        <div>\n          <sc-for list=\"{{sel.checklist}}\" as=\"c\" hint-placeholder-count=\"7\">\n            <div class=\"checkrow\">\n              <button class=\"{{c.cls}}\" type=\"button\" sc-camel-on-click=\"{{c.toggle}}\" aria-label=\"Mark {{c.label}}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg><\/button>\n              <div class=\"grow\"><div class=\"name\">{{c.label}}<\/div><div class=\"muted small\">{{c.sub}}<\/div><\/div>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n      <\/section>\n      <section class=\"card\" style=\"flex:1 1 360px\">\n        <div class=\"chead\"><h3>Stay timeline<\/h3><\/div>\n        <div>\n          <sc-for list=\"{{sel.timeline}}\" as=\"l\" hint-placeholder-count=\"4\">\n            <div class=\"tl\"><div class=\"tld\">{{l.d}}<\/div><span class=\"tlm\" style=\"background:{{l.c}}\"><\/span><div class=\"grow\"><div class=\"name\">{{l.t}}<\/div><div class=\"muted small\">{{l.s}}<\/div><\/div><\/div>\n          <\/sc-for>\n        <\/div>\n      <\/section>\n    <\/div>\n  <\/sc-if>\n\n  <sc-if value=\"{{tabFamily}}\" hint-placeholder-val=\"{{false}}\">\n    <div class=\"cols\">\n      <section class=\"card\" style=\"flex:3 1 460px\">\n        <div class=\"chead\"><h3>Everything logged for this patient<\/h3><button class=\"btn sm pri\" type=\"button\" sc-camel-on-click=\"{{addCall}}\">Call and log<\/button><\/div>\n        <div>\n          <sc-for list=\"{{sel.log}}\" as=\"l\" hint-placeholder-count=\"3\">\n            <div class=\"tl\"><div class=\"tld\">{{l.d}}<\/div><span class=\"tlm\" style=\"background:#1e6cdb\"><\/span><div class=\"grow\"><div class=\"name\">{{l.what}} <sc-if value=\"{{l.hasTag}}\" hint-placeholder-val=\"{{false}}\"><span class=\"{{l.tagCls}}\">{{l.tagLabel}}<\/span><\/sc-if><\/div><div class=\"muted small\">{{l.who}} · {{l.time}} · {{l.how}}<\/div><sc-if value=\"{{l.hasNote}}\" hint-placeholder-val=\"{{false}}\"><div class=\"small\" style=\"margin-top:4px\">{{l.note}}<\/div><\/sc-if><\/div><\/div>\n          <\/sc-for>\n          <sc-if value=\"{{sel.noLog}}\" hint-placeholder-val=\"{{false}}\"><div class=\"cpad muted\">No contact logged yet.<\/div><\/sc-if>\n        <\/div>\n      <\/section>\n      <section class=\"card\" style=\"flex:2 1 320px\">\n        <div class=\"chead\"><h3>Visits and outings<\/h3><span class=\"muted small\">Security sees this list<\/span><\/div>\n        <div>\n          <sc-for list=\"{{sel.visits}}\" as=\"v\" hint-placeholder-count=\"3\">\n            <div class=\"kvrow\"><div class=\"k\">{{v.k}}<\/div><div class=\"grow\">{{v.v}}<\/div><\/div>\n          <\/sc-for>\n        <\/div>\n      <\/section>\n    <\/div>\n  <\/sc-if>\n\n  <sc-if value=\"{{tabPrefs}}\" hint-placeholder-val=\"{{false}}\">\n    <div class=\"cols\">\n      <section class=\"card\" style=\"flex:1 1 380px\">\n        <div class=\"chead\"><h3>Preferences<\/h3><button class=\"btn sm\" type=\"button\">Edit<\/button><\/div>\n        <div class=\"muted small\" style=\"padding:10px 20px 0\">Shared by the care team. Nursing, kitchen and front desk can read this.<\/div>\n        <div style=\"padding-top:6px\">\n          <sc-for list=\"{{sel.prefs}}\" as=\"pf\" hint-placeholder-count=\"6\"><div class=\"kvrow\"><div class=\"k\">{{pf.k}}<\/div><div class=\"grow\">{{pf.v}}<\/div><\/div><\/sc-for>\n        <\/div>\n      <\/section>\n      <section class=\"card\" style=\"flex:1 1 380px\">\n        <div class=\"chead\"><h3>Belongings<\/h3><span class=\"muted small\">Logged at admission with front desk<\/span><\/div>\n        <div>\n          <sc-for list=\"{{sel.belongings}}\" as=\"b\" hint-placeholder-count=\"4\"><div class=\"kvrow\"><div class=\"k\">{{b.k}}<\/div><div class=\"grow\">{{b.v}}<\/div><\/div><\/sc-for>\n        <\/div>\n      <\/section>\n    <\/div>\n  <\/sc-if>\n\n  <sc-if value=\"{{tabConcerns}}\" hint-placeholder-val=\"{{false}}\">\n    <section class=\"card\">\n      <div class=\"chead\"><h3>Grievances for this stay<\/h3><button class=\"btn sm soft\" type=\"button\" sc-camel-on-click=\"{{openLog}}\">+ Log grievance<\/button><\/div>\n      <div>\n        <sc-for list=\"{{sel.concerns}}\" as=\"c\" hint-placeholder-count=\"2\">\n          <div class=\"listrow\"><span class=\"{{c.tyCls}}\" style=\"flex:0 0 90px\">{{c.typeLabel}}<\/span><div class=\"grow\"><div class=\"name\">{{c.title}}<\/div><div class=\"muted small\">{{c.raisedBy}} · {{c.owner}}<\/div><\/div><span class=\"{{c.slaCls}}\">{{c.slaText}}<\/span><button class=\"btn sm\" type=\"button\" sc-camel-on-click=\"{{c.open}}\">Open<\/button><\/div>\n        <\/sc-for>\n        <sc-if value=\"{{sel.noConcerns}}\" hint-placeholder-val=\"{{false}}\"><div class=\"cpad muted\">No grievances logged for this stay.<\/div><\/sc-if>\n      <\/div>\n    <\/section>\n  <\/sc-if>\n\n  <sc-if value=\"{{tabDischarge}}\" hint-placeholder-val=\"{{false}}\">\n    <section class=\"card\">\n      <div class=\"chead\"><div><h3>Discharge handoff<\/h3><span class=\"muted small\">Each team ticks its own step. You see the whole list.<\/span><\/div><button class=\"btn sm pri\" type=\"button\" sc-camel-on-click=\"{{openDcheck}}\">Open discharge checklist<\/button><\/div>\n      <div>\n        <sc-for list=\"{{sel.dischargeList}}\" as=\"c\" hint-placeholder-count=\"7\">\n          <div class=\"checkrow\">\n            <span class=\"{{c.dot}}\"><\/span>\n            <div class=\"grow\"><div class=\"name\">{{c.label}}<\/div><div class=\"muted small\">{{c.owner}}<\/div><\/div>\n            <span class=\"{{c.chip}}\">{{c.status}}<\/span>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/section>\n  <\/sc-if>\n<\/sc-if>\n\n<!-- ============ CONCERNS ============ -->\n<sc-if value=\"{{isConcerns}}\" hint-placeholder-val=\"{{false}}\">\n  <sc-for list=\"{{gvAlerts}}\" as=\"a\" hint-placeholder-count=\"2\"><div class=\"{{a.cls}}\"><span>{{a.text}}<\/span><button class=\"btn sm\" type=\"button\" sc-camel-on-click=\"{{a.act}}\">{{a.btn}}<\/button><\/div><\/sc-for>\n  <div class=\"toolbar\">\n    <input class=\"search\" type=\"search\" placeholder=\"Search by patient name\" value=\"{{gvQ}}\" sc-camel-on-change=\"{{setGvQ}}\" aria-label=\"Search grievances\">\n    <div class=\"seg\" role=\"tablist\">\n      <sc-for list=\"{{filters}}\" as=\"f\" hint-placeholder-count=\"5\"><button class=\"{{f.cls}}\" type=\"button\" sc-camel-on-click=\"{{f.go}}\">{{f.label}} <span class=\"n\">{{f.n}}<\/span><\/button><\/sc-for>\n    <\/div>\n    \n  <\/div>\n  <div class=\"gv-srcs\" role=\"tablist\" aria-label=\"Where it came from\"><span class=\"muted small\">Came in as<\/span><sc-for list=\"{{srcFilters}}\" as=\"f\" hint-placeholder-count=\"5\"><button class=\"{{f.cls}}\" type=\"button\" sc-camel-on-click=\"{{f.go}}\">{{f.label}} <span class=\"n\">{{f.n}}<\/span><\/button><\/sc-for><\/div>\n  <div class=\"cols gv-cols\">\n    <section class=\"card gv-list\" style=\"flex:3 1 560px;overflow:hidden\">\n      <div class=\"scrollx\">\n        <sc-raw-table class=\"pt\">\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Grievance<\/sc-raw-th><sc-raw-th>Patient<\/sc-raw-th><sc-raw-th>Owner<\/sc-raw-th><sc-raw-th>Time left<\/sc-raw-th><sc-raw-th>Status<\/sc-raw-th><\/sc-raw-tr><\/sc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{concernRows}}\" as=\"c\" hint-placeholder-count=\"6\">\n              <sc-raw-tr class=\"{{c.rowCls}}\" style=\"{{c.sr}}\" sc-camel-on-click=\"{{c.open}}\">\n                <sc-raw-td><div class=\"name\">{{c.title}}<\/div><div class=\"muted small\"><span class=\"{{c.srcCls}}\">{{c.srcLabel}}<\/span> {{c.id}} · {{c.category}} · {{c.raisedBy}}<\/div><\/sc-raw-td>\n                <sc-raw-td>{{c.patient}}<div class=\"muted small\">{{c.room}}<\/div><\/sc-raw-td>\n                <sc-raw-td>{{c.owner}}<div class=\"muted small\">{{c.ownerRole}}<\/div><div class=\"small\" style=\"color:#1e5bb8\">{{c.latest}}<\/div><\/sc-raw-td>\n                <sc-raw-td><span class=\"{{c.slaCls}}\">{{c.slaText}}<\/span><div class=\"muted small\">{{c.stageShort}}<\/div><\/sc-raw-td>\n                <sc-raw-td><span class=\"{{c.statusCls}}\">{{c.status}}<\/span><\/sc-raw-td>\n              <\/sc-raw-tr>\n            <\/sc-for>\n          <\/sc-raw-tbody>\n        <\/sc-raw-table>\n      <\/div>\n    <\/section>\n    <section class=\"card\" style=\"flex:2 1 340px\">\n      <div class=\"chead\"><div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\"><span class=\"{{cur.statusCls}}\">{{cur.status}}<\/span><span class=\"{{cur.slaCls}}\">{{cur.slaText}}<\/span><\/div><span class=\"muted small\">{{cur.id}}<\/span><\/div>\n      <div class=\"cpad\" style=\"display:flex;flex-direction:column;gap:14px\">\n        <div><h3 style=\"font-size:17px\">{{cur.title}}<\/h3><div class=\"muted small\" style=\"margin-top:4px\">Logged {{cur.logged}} · via {{cur.via}}<\/div><\/div>\n        <div class=\"kf\" style=\"margin-top:0\">\n          <div><div class=\"lbl\">Patient<\/div><div class=\"v\">{{cur.patient}}<\/div><\/div>\n          <div><div class=\"lbl\">Raised by<\/div><div class=\"v\">{{cur.raisedBy}}<\/div><\/div>\n          <div><div class=\"lbl\">Category<\/div><div class=\"v\">{{cur.category}}<\/div><\/div>\n          <div><div class=\"lbl\">Came in as<\/div><div class=\"v\">{{cur.srcLabel}}<\/div><div class=\"muted small\">Tag: {{cur.tagLabel}}<\/div><\/div>\n          <div><div class=\"lbl\">Owner<\/div><div class=\"v\">{{cur.owner}}<\/div><div class=\"muted small\">{{cur.ownerRole}}<\/div><\/div>\n        <\/div>\n        <div><div class=\"lbl\" style=\"margin-bottom:4px\">What they said<\/div><div>{{cur.desc}}<\/div><\/div>\n        <sc-if value=\"{{cur.isOwnerStage}}\" hint-placeholder-val=\"{{true}}\">\n          <div class=\"m4-stage\">\n            <div class=\"m4-steps\"><span class=\"m4-s done\">Logged<\/span><span class=\"{{cur.st2}}\">Owner reminded, 3 h<\/span><span class=\"{{cur.st3}}\">Chandraji, 6 h<\/span><\/div>\n            <div class=\"m4-txt\">{{cur.stageTxt}}<\/div>\n            <div class=\"m4-clock muted small\">Demo clock +{{demoH}} h <button class=\"btn sm link\" type=\"button\" sc-camel-on-click=\"{{demoPlus1}}\">+1 h<\/button><button class=\"btn sm link\" type=\"button\" sc-camel-on-click=\"{{demoPlus3}}\">+3 h<\/button><button class=\"btn sm link\" type=\"button\" sc-camel-on-click=\"{{demoReset}}\">Reset<\/button><\/div>\n          <\/div>\n          <div class=\"field\"><label for=\"ownupd\">Latest update from the owner<\/label><div style=\"display:flex;gap:8px\"><input class=\"search\" id=\"ownupd\" placeholder=\"What the owner has done so far\" value=\"{{ownUpd}}\" sc-camel-on-change=\"{{setOwnUpd}}\" style=\"flex:1\"><button class=\"btn sm\" type=\"button\" sc-camel-on-click=\"{{postOwnUpd}}\">Post update<\/button><\/div><div class=\"muted small\">Owners update from their own portal. It shows here and in the list.<\/div><\/div>\n          <sc-if value=\"{{cur.isSafety}}\" hint-placeholder-val=\"{{false}}\"><div class=\"field\"><label for=\"incno\">Incident report number (needed to close a safety concern)<\/label><input class=\"search\" id=\"incno\" placeholder=\"e.g. IR-2026-114\" value=\"{{incNo}}\" sc-camel-on-change=\"{{setIncNo}}\"><\/div><\/sc-if>\n          <div class=\"field\"><label for=\"resnote\">What the owner did to fix it<\/label><textarea id=\"resnote\" placeholder=\"What was done, and by whom\" value=\"{{resNote}}\" sc-camel-on-change=\"{{setResNote}}\"><\/textarea><\/div>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><button class=\"btn pri sm\" type=\"button\" sc-camel-on-click=\"{{markFixed}}\">Owner has fixed it<\/button><button class=\"btn sm\" type=\"button\" sc-camel-on-click=\"{{escalateCur}}\">Escalate to GM Ops (email S Chandra)<\/button><\/div>\n          <sc-if value=\"{{m4NeedFix}}\" hint-placeholder-val=\"{{false}}\"><div class=\"note\">Write what the owner did first. A safety concern also needs an incident report number.<\/div><\/sc-if>\n        <\/sc-if>\n        <sc-if value=\"{{cur.isConfirm}}\" hint-placeholder-val=\"{{false}}\">\n          <div class=\"info\"><b>Owner says it is fixed.<\/b> {{cur.fixNote}}<\/div>\n          <div class=\"note\">Next step: call the family. Is it fixed, and are they happy?<\/div>\n          <div class=\"field\"><label for=\"resnote\">What the family said<\/label><textarea id=\"resnote\" placeholder=\"In their words\" value=\"{{resNote}}\" sc-camel-on-change=\"{{setResNote}}\"><\/textarea><\/div>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><button class=\"btn pri sm\" type=\"button\" sc-camel-on-click=\"{{confirmHappy}}\">Family is happy: close it<\/button><button class=\"btn sm\" type=\"button\" sc-camel-on-click=\"{{confirmNotHappy}}\">Not happy: send back to owner<\/button><\/div>\n        <\/sc-if>\n        <sc-if value=\"{{cur.isClosed}}\" hint-placeholder-val=\"{{false}}\"><div class=\"info\">{{cur.resolution}}<\/div><\/sc-if>\n        <sc-if value=\"{{cur.sentBackTxt}}\" hint-placeholder-val=\"{{false}}\"><div class=\"muted small\">{{cur.sentBackTxt}}<\/div><\/sc-if>\n      <\/div>\n    <\/section>\n  <\/div>\n<\/sc-if>\n\n<!-- ============ END OF DAY UPDATE (per person) ============ -->\n<sc-if value=\"{{isFloor}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"hello\">\n    <div><h2>End of day updates<\/h2><div class=\"muted\">Each person on the floor sends their own update at the end of the day. An issue goes straight to the team that owns it.<\/div><\/div>\n  <\/div>\n  <div class=\"toolbar\">\n    <div class=\"seg\" role=\"tablist\"><sc-for list=\"{{floorSegs}}\" as=\"g\" hint-placeholder-count=\"3\"><button class=\"{{g.cls}}\" type=\"button\" sc-camel-on-click=\"{{g.go}}\">{{g.label}}<\/button><\/sc-for><\/div>\n    <div class=\"eod-sum\"><b>{{eodIn}}<\/b> of {{eodTotal}} updates in <span class=\"muted\">for {{floorName}}<\/span> <span class=\"eod-iss\">{{eodIssueText}}<\/span><\/div>\n  <\/div>\n  <div class=\"fr-walk eod-walk\" aria-hidden=\"true\"><sc-for list=\"{{eodStrip}}\" as=\"z\" hint-placeholder-count=\"7\"><i class=\"{{z.cls}}\"><\/i><\/sc-for><\/div>\n  <section class=\"card eodl\">\n    <div class=\"eodl-h\"><span>Person<\/span><span>Today's check<\/span><span>Update<\/span><\/div>\n    <sc-for list=\"{{eodPeople}}\" as=\"o\" hint-placeholder-count=\"7\">\n      <div class=\"eodl-r\">\n        <div class=\"eodl-who\"><div class=\"avatar av-tint\" style=\"width:38px;height:38px;font-size:12px\">{{o.ini}}<\/div><div><div class=\"name\">{{o.role}}<\/div><div class=\"muted small\">{{o.who}}<\/div><\/div><\/div>\n        <div class=\"eodl-items\">\n          <sc-for list=\"{{o.items}}\" as=\"f\" hint-placeholder-count=\"1\">\n            <div class=\"{{f.rowCls}}\">\n              <div class=\"fr-state\" aria-hidden=\"true\"><\/div>\n              <div class=\"fr-txt\"><div class=\"name\">{{f.label}}<\/div><\/div>\n              <div class=\"fr-tog\" role=\"group\" aria-label=\"{{f.label}}\"><button class=\"{{f.okCls}}\" type=\"button\" sc-camel-on-click=\"{{f.ok}}\">OK<\/button><button class=\"{{f.isCls}}\" type=\"button\" sc-camel-on-click=\"{{f.issue}}\">Issue<\/button><\/div>\n              <div class=\"fr-extra\"><div><span class=\"fr-due\">Goes to {{f.owner}}, due in 4 hours<\/span><input aria-label=\"What is wrong: {{f.label}}\" placeholder=\"What did you see? (optional)\" value=\"{{f.note}}\" sc-camel-on-change=\"{{f.setNote}}\"><\/div><\/div>\n            <\/div>\n          <\/sc-for>\n        <\/div>\n        <div class=\"eodl-act\"><span class=\"{{o.chip}}\">{{o.status}}<\/span><button class=\"{{o.btnCls}}\" type=\"button\" sc-camel-on-click=\"{{o.send}}\">{{o.btnLabel}}<\/button><span class=\"muted small\">{{o.msg}}<\/span><\/div>\n      <\/div>\n    <\/sc-for>\n  <\/section>\n<\/sc-if>\n\n<!-- ============ DISCHARGE FEEDBACK (FORM 6) ============ -->\n<sc-if value=\"{{isFeedback}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"hello\"><div><h2>Discharge SOP<\/h2><div class=\"muted\">Checklist progress, then the family's feedback.<\/div><\/div><div class=\"seg fl-tabs\" role=\"tablist\"><sc-for list=\"{{dcTabs}}\" as=\"g\" hint-placeholder-count=\"2\"><button class=\"{{g.cls}}\" type=\"button\" sc-camel-on-click=\"{{g.go}}\">{{g.label}}<sc-if value=\"{{g.has}}\" hint-placeholder-val=\"{{false}}\"> <span class=\"n\">{{g.n}}<\/span><\/sc-if><\/button><\/sc-for><\/div><\/div>\n  <div class=\"{{fbGoCls}}\">\n    <div class=\"lz-t\"><h2>{{fbGoTitle}}<\/h2><p>{{fbGoSub}}<\/p><\/div>\n    <button class=\"btn pri lz-big\" type=\"button\" sc-camel-on-click=\"{{saveFb}}\">Save feedback<\/button>\n  <\/div>\n  <section class=\"lz-q\">\n    <h3>Whose feedback is this?<\/h3>\n    <div class=\"lz-chips\"><sc-for list=\"{{fbPats}}\" as=\"o\" hint-placeholder-count=\"5\"><button class=\"{{o.cls}}\" type=\"button\" sc-camel-on-click=\"{{o.pick}}\">{{o.label}}<\/button><\/sc-for><\/div>\n    <div class=\"lz-line\">{{fbWho}}<\/div>\n    <div class=\"name\">Who is answering?<\/div>\n    <div class=\"lz-chips\"><sc-for list=\"{{whoBtns}}\" as=\"b\" hint-placeholder-count=\"6\"><button class=\"{{b.cls}}\" type=\"button\" sc-camel-on-click=\"{{b.pick}}\">{{b.label}}<\/button><\/sc-for><\/div>\n  <\/section>\n  <section class=\"lz-q\">\n    <h3>1. How likely are you to recommend Tulasi to another family?<\/h3>\n    <div class=\"lz-nps\"><sc-for list=\"{{npsBtns}}\" as=\"b\" hint-placeholder-count=\"11\"><button class=\"{{b.cls}}\" type=\"button\" sc-camel-on-click=\"{{b.pick}}\" aria-label=\"Score {{b.n}}\">{{b.n}}<\/button><\/sc-for><\/div>\n    <div class=\"lz-line\">{{fbNpsHint}}<\/div>\n  <\/section>\n  <section class=\"lz-q\">\n    <h3>2. How was each of these? <span class=\"lz-opt\">1 = poor, 5 = excellent<\/span><\/h3>\n    <div><sc-for list=\"{{rateRows}}\" as=\"r\" hint-placeholder-count=\"6\"><div class=\"lz-rate\"><span>{{r.label}}<\/span><div class=\"lz-stars\"><sc-for list=\"{{r.btns}}\" as=\"s\" hint-placeholder-count=\"5\"><button class=\"{{s.cls}}\" type=\"button\" sc-camel-on-click=\"{{s.pick}}\" aria-label=\"{{r.label}} {{s.n}} of 5\">{{s.n}}<\/button><\/sc-for><\/div><\/div><\/sc-for><\/div>\n  <\/section>\n  <section class=\"lz-q\">\n    <h3>3. In their own words <span class=\"lz-opt\">(optional)<\/span><\/h3>\n    <div class=\"lz-fields\">\n      <div class=\"field\"><label for=\"fb1\">What helped your family most?<\/label><textarea id=\"fb1\" style=\"min-height:64px\" placeholder=\"In their words\" value=\"{{fb.helped}}\" sc-camel-on-change=\"{{setFbHelped}}\"><\/textarea><\/div>\n      <div class=\"field\"><label for=\"fb2\">What could we have done better?<\/label><textarea id=\"fb2\" style=\"min-height:64px\" placeholder=\"In their words\" value=\"{{fb.better}}\" sc-camel-on-change=\"{{setFbBetter}}\"><\/textarea><\/div>\n    <\/div>\n  <\/section>\n  <section class=\"lz-q\">\n    <h3>4. May we call in 2 weeks to ask how recovery is going?<\/h3>\n    <div class=\"lz-chips\"><sc-for list=\"{{callBtns}}\" as=\"b\" hint-placeholder-count=\"2\"><button class=\"{{b.cls}}\" type=\"button\" sc-camel-on-click=\"{{b.pick}}\">{{b.label}}<\/button><\/sc-for><\/div>\n    <sc-if value=\"{{fbCallYes}}\" hint-placeholder-val=\"{{true}}\"><div class=\"fgrid\">\n      <div class=\"field\"><label for=\"fbm\">Best mobile number<\/label><input id=\"fbm\" placeholder=\"+91\" value=\"{{fb.mobile}}\" sc-camel-on-change=\"{{setFbMobile}}\"><\/div>\n      <div class=\"field\"><label for=\"fbt\">Best time<\/label><input id=\"fbt\" placeholder=\"e.g. after 5 pm\" value=\"{{fb.time}}\" sc-camel-on-change=\"{{setFbTime}}\"><\/div>\n    <\/div><\/sc-if>\n  <\/section>\n  <sc-if value=\"{{isDetractor}}\" hint-placeholder-val=\"{{false}}\"><div class=\"note\" style=\"font-size:15px\">Score of 6 or below. Saving opens a grievance for you and tells Chandraji the same day.<\/div><\/sc-if>\n  <div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap\"><button class=\"btn pri lz-big\" type=\"button\" sc-camel-on-click=\"{{saveFb}}\">Save feedback<\/button><span style=\"font-size:15px\">{{fbMsg}}<\/span><\/div>\n\n  <section class=\"card\">\n    <button class=\"lz-acc-h\" type=\"button\" sc-camel-on-click=\"{{fbToggleSum}}\"><span><span class=\"lz-ttl\">See the last 30 days<\/span><span class=\"lz-sub\">Scores, ratings by area and the weakest area<\/span><\/span><span class=\"{{fbSumCaret}}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\/path><\/svg><\/span><\/button>\n    <sc-if value=\"{{fbShowSum}}\" hint-placeholder-val=\"{{false}}\"><div class=\"lz-acc-b\">\n      <div class=\"tiles rail\" style=\"border:0;border-radius:0\">\n        <sc-for list=\"{{fbTiles}}\" as=\"t\" hint-placeholder-count=\"4\"><div class=\"tile\"><span class=\"lbl\">{{t.label}}<\/span><b>{{t.value}}<\/b><span class=\"muted small\">{{t.sub}}<\/span><\/div><\/sc-for>\n      <\/div>\n      <div style=\"border-top:1px solid #eef2f6\">\n        <sc-for list=\"{{fbAreas}}\" as=\"a\" hint-placeholder-count=\"6\"><div class=\"listrow\" style=\"padding:11px 20px\"><div style=\"flex:0 0 200px\">{{a.label}}<\/div><div class=\"bar blue\" style=\"flex:1 1 100px\"><i style=\"width:{{a.pct}}\"><\/i><\/div><div class=\"name\" style=\"flex:0 0 34px;text-align:right\">{{a.avg}}<\/div><\/div><\/sc-for>\n      <\/div>\n      <div class=\"cpad\"><div class=\"note\">{{fbLowest}}<\/div><\/div>\n    <\/div><\/sc-if>\n  <\/section>\n<\/sc-if>\n\n<!-- ============ WEEKLY REPORT ============ -->\n\n<!-- ============ DISCHARGE CHECKLIST ============ -->\n<sc-if value=\"{{isDcheck}}\" hint-placeholder-val=\"{{false}}\">\n  <div class=\"hello\"><div><h2>Discharge SOP<\/h2><div class=\"muted\">The ward team fills in the checklist. You follow it here, remind whoever is behind, then collect the family's feedback.<\/div><\/div><div class=\"seg fl-tabs\" role=\"tablist\"><sc-for list=\"{{dcTabs}}\" as=\"g\" hint-placeholder-count=\"2\"><button class=\"{{g.cls}}\" type=\"button\" sc-camel-on-click=\"{{g.go}}\">{{g.label}}<sc-if value=\"{{g.has}}\" hint-placeholder-val=\"{{false}}\"> <span class=\"n\">{{g.n}}<\/span><\/sc-if><\/button><\/sc-for><\/div><\/div>\n  <section class=\"card sop-head\"><div class=\"cpad lz-stack\">\n    <div class=\"sop-hd\"><div class=\"lz-chips\"><sc-for list=\"{{dcPatients}}\" as=\"o\" hint-placeholder-count=\"1\"><button class=\"{{o.cls}}\" type=\"button\" sc-camel-on-click=\"{{o.pick}}\">{{o.label}}<\/button><\/sc-for><\/div><\/div>\n    <div class=\"lz-line\">{{dcLine}}<\/div>\n    <div class=\"lz-prog\"><div class=\"lz-bar\"><i class=\"{{dcBarCls}}\" style=\"width:{{dcPct}}\"><\/i><\/div><b>{{dcPctText}}<\/b><\/div>\n    <div class=\"muted small\">Read only. The psychiatrist, psychologist, duty nurse, front desk and billing tick their own items in the doctor portal. You can tick the items that are yours.<\/div>\n  <\/div><\/section>\n  <div class=\"sop-steps\">\n    <div class=\"sop-st {{sopGoTone}}\"><span class=\"sop-n\">1<\/span><div class=\"sop-b\"><b>{{dcGoTitle}}<\/b><p>{{dcGoSub}}<\/p><button class=\"btn lz-big\" type=\"button\" sc-camel-on-click=\"{{dcGoAct}}\">{{dcGoBtn}}<\/button><\/div><\/div>\n    <div class=\"sop-st\"><span class=\"sop-n\">2<\/span><div class=\"sop-b\"><b>Collect the family's feedback<\/b><p>{{dcCollectHint}}<\/p><div style=\"display:flex;gap:8px;flex-wrap:wrap\"><button class=\"btn pri lz-big\" type=\"button\" sc-camel-on-click=\"{{dcCollect}}\">Collect feedback<\/button><\/div>\n      <sc-if value=\"{{dcShowBlocks}}\" hint-placeholder-val=\"{{false}}\"><div class=\"note\"><b>Still open on the ward side:<\/b><sc-for list=\"{{dcBlocks}}\" as=\"b\" hint-placeholder-count=\"3\"><div>· {{b.t}}<\/div><\/sc-for><\/div><\/sc-if>\n      <sc-if value=\"{{dcOpenFinal}}\" hint-placeholder-val=\"{{true}}\"><div><button class=\"btn link\" type=\"button\" sc-camel-on-click=\"{{dcSim}}\">Demo only: show the ward team finishing the checklist<\/button><\/div><\/sc-if><\/div><\/div>\n    <div class=\"sop-st\"><span class=\"sop-n\">3<\/span><div class=\"sop-b\"><b>IPD follow-ups<\/b><sc-if value=\"{{dcDone}}\" hint-placeholder-val=\"{{false}}\"><p>{{dcDoneText}}<\/p><button class=\"btn lz-big\" type=\"button\" sc-camel-on-click=\"{{goFollow}}\">Open IPD follow-ups<\/button><\/sc-if><sc-if value=\"{{dcNotDone}}\" hint-placeholder-val=\"{{true}}\"><p>The OPD visits and the Day-14 and Day-30 calls are added here once the feedback is collected.<\/p><\/sc-if><\/div><\/div>\n  <\/div>\n  \n  <section class=\"card\">\n    <div class=\"chead\"><h3>Who has done what<\/h3><span class=\"muted small\">Must-do items, by person<\/span><\/div>\n    <div class=\"dc-own\">\n      <sc-for list=\"{{dcOwners}}\" as=\"o\" hint-placeholder-count=\"6\">\n        <div class=\"dc-own-r\"><span class=\"name\">{{o.role}}<\/span><div class=\"bar blue\"><i style=\"width:{{o.pct}}\"><\/i><\/div><span class=\"{{o.chip}}\">{{o.txt}}<\/span><sc-if value=\"{{o.canRemind}}\" hint-placeholder-val=\"{{false}}\"><button class=\"{{o.remCls}}\" type=\"button\" sc-camel-on-click=\"{{o.remind}}\">{{o.remLabel}}<\/button><\/sc-if><\/div>\n      <\/sc-for>\n    <\/div>\n  <\/section>\n\n  <div class=\"dc-ro\">\n  <sc-for list=\"{{dcSecA}}\" as=\"g\" hint-placeholder-count=\"2\">\n    <section class=\"card lz-acc\" id=\"{{g.dom}}\">\n      <button class=\"lz-acc-h\" type=\"button\" sc-camel-on-click=\"{{g.toggle}}\">\n        <span class=\"{{g.icCls}}\">{{g.icTxt}}<\/span>\n        <span><span class=\"lz-ttl\">{{g.title}}<\/span><span class=\"lz-sub\">{{g.sub}}<\/span><\/span>\n        <span class=\"{{g.caretCls}}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\/path><\/svg><\/span>\n      <\/button>\n      <sc-if value=\"{{g.open}}\" hint-placeholder-val=\"{{false}}\"><div class=\"lz-acc-b\">\n        <sc-if value=\"{{g.isRisk}}\" hint-placeholder-val=\"{{false}}\"><div class=\"cpad\" style=\"border-bottom:1px solid #eef2f6;display:flex;flex-direction:column;gap:10px\"><div class=\"name\">How risky is it to send this patient home?<\/div><div class=\"lz-chips\"><sc-for list=\"{{g.riskBtns}}\" as=\"b\" hint-placeholder-count=\"3\"><button class=\"{{b.cls}}\" type=\"button\" sc-camel-on-click=\"{{b.pick}}\">{{b.label}}<\/button><\/sc-for><\/div><div class=\"muted small\">{{g.riskHint}}<\/div><\/div><\/sc-if>\n        <div>\n        <sc-for list=\"{{g.items}}\" as=\"c\" hint-placeholder-count=\"5\">\n          <div class=\"{{c.rowCls}}\" sc-camel-on-click=\"{{c.toggle}}\">\n            <span class=\"{{c.cls}}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"><\/path><\/svg><\/span>\n            <div class=\"grow\"><div class=\"name\">{{c.label}}<\/div><div class=\"muted small\">{{c.sub}}<\/div><\/div>\n            <sc-if value=\"{{c.hasTag}}\" hint-placeholder-val=\"{{false}}\"><span class=\"{{c.tagCls}}\">{{c.tag}}<\/span><\/sc-if>\n          <\/div>\n        <\/sc-for>\n        <\/div>\n        <sc-if value=\"{{g.hasLeft}}\" hint-placeholder-val=\"{{false}}\"><div class=\"lz-acc-f\"><button class=\"btn lz-big lz-green\" type=\"button\" sc-camel-on-click=\"{{g.tickAll}}\">{{g.tickLabel}}<\/button><span class=\"muted small\">Press this only if every one of them was done.<\/span><\/div><\/sc-if>\n      <\/div><\/sc-if>\n    <\/section>\n  <\/sc-for>\n\n  <section class=\"card lz-acc\" id=\"dc-plan\">\n    <button class=\"lz-acc-h\" type=\"button\" sc-camel-on-click=\"{{dcf.toggle}}\">\n      <span class=\"{{dcf.icCls}}\">{{dcf.icTxt}}<\/span>\n      <span><span class=\"lz-ttl\">Follow-up plan<\/span><span class=\"lz-sub\">{{dcf.sub}}<\/span><\/span>\n      <span class=\"{{dcf.caretCls}}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\/path><\/svg><\/span>\n    <\/button>\n    <sc-if value=\"{{dcf.open}}\" hint-placeholder-val=\"{{false}}\"><div class=\"lz-acc-b\">\n      <div class=\"cpad lz-stack\" style=\"gap:18px\">\n        <div class=\"muted small\">Pick when each doctor will see the patient again. These dates make the call centre's list by themselves.<\/div>\n        <div class=\"lz-q\" style=\"padding:16px 18px;gap:12px\">\n          <div class=\"name\">Psychiatrist · {{dcf.doctor}}<\/div>\n          <div class=\"lz-chips\"><sc-for list=\"{{dcf.docQuick}}\" as=\"b\" hint-placeholder-count=\"3\"><button class=\"{{b.cls}}\" type=\"button\" sc-camel-on-click=\"{{b.pick}}\">{{b.label}}<\/button><\/sc-for><\/div>\n          <div class=\"fgrid\"><div class=\"field\"><label for=\"dcdd\">Or pick another date<\/label><input id=\"dcdd\" type=\"date\" value=\"{{dcf.docDate}}\" sc-camel-on-change=\"{{dcf.setDocDate}}\"><\/div><div class=\"field\"><label for=\"dcdt\">Time<\/label><input id=\"dcdt\" type=\"time\" value=\"{{dcf.docTime}}\" sc-camel-on-change=\"{{dcf.setDocTime}}\"><\/div><\/div>\n        <\/div>\n        <div class=\"lz-q\" style=\"padding:16px 18px;gap:12px\">\n          <div class=\"name\">Psychologist · {{dcf.psych}}<\/div>\n          <div class=\"lz-chips\"><sc-for list=\"{{dcf.psyQuick}}\" as=\"b\" hint-placeholder-count=\"3\"><button class=\"{{b.cls}}\" type=\"button\" sc-camel-on-click=\"{{b.pick}}\">{{b.label}}<\/button><\/sc-for><\/div>\n          <div class=\"fgrid\"><div class=\"field\"><label for=\"dcpd\">Or pick another date<\/label><input id=\"dcpd\" type=\"date\" value=\"{{dcf.psyDate}}\" sc-camel-on-change=\"{{dcf.setPsyDate}}\"><\/div><div class=\"field\"><label for=\"dcpt\">Time<\/label><input id=\"dcpt\" type=\"time\" value=\"{{dcf.psyTime}}\" sc-camel-on-change=\"{{dcf.setPsyTime}}\"><\/div><\/div>\n        <\/div>\n        <sc-for list=\"{{dcf.gaps}}\" as=\"m\" hint-placeholder-count=\"1\">\n          <div class=\"note dc-gap\"><span><b>{{m.who}}<\/b> has not given a follow-up date. Ask before the family leaves.<\/span><span style=\"display:flex;gap:8px;flex-wrap:wrap\"><button class=\"{{m.remCls}}\" type=\"button\" sc-camel-on-click=\"{{m.remind}}\">{{m.remLabel}}<\/button><button class=\"{{m.cntCls}}\" type=\"button\" sc-camel-on-click=\"{{m.count}}\">{{m.cntLabel}}<\/button><\/span><\/div>\n        <\/sc-for>\n        <div class=\"lz-fld\"><div class=\"name\">Family agrees to the Day-14 and Day-30 calls?<\/div><div class=\"lz-chips\"><sc-for list=\"{{dcf.consentBtns}}\" as=\"b\" hint-placeholder-count=\"2\"><button class=\"{{b.cls}}\" type=\"button\" sc-camel-on-click=\"{{b.pick}}\">{{b.label}}<\/button><\/sc-for><\/div><\/div>\n        <div class=\"lz-fld\"><div class=\"name\">Who makes the calls?<\/div><div class=\"lz-chips\"><sc-for list=\"{{dcf.assignBtns}}\" as=\"b\" hint-placeholder-count=\"3\"><button class=\"{{b.cls}}\" type=\"button\" sc-camel-on-click=\"{{b.pick}}\">{{b.label}}<\/button><\/sc-for><\/div><\/div>\n        <div class=\"info\" style=\"display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap\"><span>Calls go to <b>{{dcf.cName}}<\/b> {{dcf.cRelTxt}} · {{dcf.cPhone}}<\/span><button class=\"btn sm\" type=\"button\" sc-camel-on-click=\"{{dcf.toggleEditC}}\">{{dcf.editLabel}}<\/button><\/div>\n        <sc-if value=\"{{dcf.editC}}\" hint-placeholder-val=\"{{false}}\"><div class=\"fgrid\">\n          <div class=\"field\"><label for=\"dccn\">Name<\/label><input id=\"dccn\" placeholder=\"Name\" value=\"{{dcf.cName}}\" sc-camel-on-change=\"{{dcf.setCName}}\"><\/div>\n          <div class=\"field\"><label for=\"dccr\">Relation<\/label><input id=\"dccr\" placeholder=\"e.g. Father\" value=\"{{dcf.cRel}}\" sc-camel-on-change=\"{{dcf.setCRel}}\"><\/div>\n          <div class=\"field\"><label for=\"dccp\">Mobile<\/label><input id=\"dccp\" placeholder=\"Mobile number\" value=\"{{dcf.cPhone}}\" sc-camel-on-change=\"{{dcf.setCPhone}}\"><\/div>\n        <\/div><\/sc-if>\n      <\/div>\n      <div style=\"border-top:1px solid #eef2f6\">\n        <sc-for list=\"{{dcf.items}}\" as=\"c\" hint-placeholder-count=\"5\">\n          <div class=\"{{c.rowCls}}\" sc-camel-on-click=\"{{c.toggle}}\">\n            <span class=\"{{c.cls}}\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 aceholder-val=\"{{false}}\">\n  <div class=\"overlay mid\">\n    <div class=\"drawer modal rc-modal\" role=\"dialog\" aria-label=\"Random call\">\n      <div class=\"toolbar\"><div><h3 style=\"font-size:19px\">Random call · {{rcName}}<\/h3><div class=\"muted small\">Call {{rcGuardian}} ({{rcRel}}) · {{rcPhone}} · {{rcCount}} done<\/div><\/div><button class=\"btn sm link\" type=\"button\" sc-camel-on-click=\"{{rcClose}}\">Close<\/button><\/div>\n      <div class=\"field\"><label>Did they pick up?<\/label><div class=\"lz-chips\"><sc-for list=\"{{rcPick}}\" as=\"b\" hint-placeholder-count=\"2\"><button class=\"{{b.cls}}\" type=\"button\" sc-camel-on-click=\"{{b.go}}\">{{b.label}}<\/button><\/sc-for><\/div><\/div>\n      <sc-if value=\"{{rcNone}}\" hint-placeholder-val=\"{{false}}\">\n        <div class=\"note\">No answer. It is saved to the record and does not count. Try again tomorrow.<\/div>\n        <div style=\"display:flex;gap:8px;margin-top:auto\"><button class=\"btn pri\" type=\"button\" sc-camel-on-click=\"{{rcNoAnswer}}\">Save no answer<\/button><button class=\"btn\" type=\"button\" sc-camel-on-click=\"{{rcClose}}\">Cancel<\/button><\/div>\n      <\/sc-if>\n      <sc-if value=\"{{rcUp}}\" hint-placeholder-val=\"{{false}}\">\n        <div class=\"rc-qs\">\n          <sc-for list=\"{{rcQs}}\" as=\"q\" hint-placeholder-count=\"7\">\n            <div class=\"rc-q\"><span class=\"rc-ql\">{{q.label}}<\/span><span class=\"rc-qb\"><button class=\"{{q.yesCls}}\" type=\"button\" sc-camel-on-click=\"{{q.yes}}\">Yes<\/button><button class=\"{{q.noCls}}\" type=\"button\" sc-camel-on-click=\"{{q.no}}\">No<\/button><\/span><\/div>\n          <\/sc-for>\n        <\/div>\n        <div class=\"field\"><label for=\"rcw\">In their words<\/label><textarea id=\"rcw\" placeholder=\"What did the family say?\" value=\"{{rcWords}}\" sc-camel-on-change=\"{{rcSetWords}}\"><\/textarea><\/div>\n        <div class=\"field\"><label>Does anything need action?<\/label><div class=\"lz-chips\"><
