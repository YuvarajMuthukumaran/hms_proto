<!-- 23 Nov 2026 (Nikita's "HMS Grievances redesign"): ticket list on the left, the grievance on the right with a stage bar
     (Logged, Investigating, Resolved, Confirmed with family, Closed), safety steps for serious ones, each issue the family raised
     with its own status and asks, an investigation log, people, and why it happened. It reads and writes the same concerns as
     the lead app (parent PXG.self: seeded list + extraConcerns, patches in concernStatus), so PX Today, Reports and the
     clinical portal keep working; new fields: g2 (stage), issues, safety, log, root, staff. Opened standalone it shows
     synthetic sample grievances only. -->
<style>

<body>
<header class="top"><h1>Grievances<small>Patient experience</small></h1><button class="btn pri" data-a="log">+ Log a grievance</button></header>
<div id="root"></div>
<script>
(function(){
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const STAGES=['Logged','Investigating','Resolved','Family communicated','Closed'];   /* 25 Nov meeting: 'Family communicated', optional unless the family raised it */   /* 25 Nov (owner): one-line labels */
const SAFETY=['Mr. S. Chandra and medical director told','CCTV for the time window saved','Written statements from staff on duty','Restraint and injection recorded in chart','Patient checked for injuries by a doctor','Family given an update within 24 h'];
const ROOTS=['Not known yet','Staff conduct','Ward rule not followed','Call centre gave wrong information','Charges not explained at admission','Maintenance fault','Policy not explained to family','Food','Other'];
const CATS=['Staff conduct','Ward rules','Billing and charges','Room and housekeeping','Food','Maintenance','Communication','Safety','Rights','Other'];
/* 24 Nov meeting: suggested actions follow the category and who raised it */
const QBY={Safety:['CCTV reviewed','Staff statement taken','Doctor checked the patient'],Rights:['Spoke to the treating doctor','Staff statement taken'],Food:['Spoke to the dietician','Diet changed'],'Food and dietary':['Spoke to the kitchen','Diet changed'],'Billing and charges':['Spoke to billing','Charges explained'],'Billing and insurance':['Spoke to billing','Charges explained'],'Room and housekeeping':['Housekeeping told','Room checked'],Maintenance:['Maintenance ticket raised','Room checked'],'Nursing care':['Spoke to nursing in-charge'],'Doctor communication':['Doctor to call the family'],'Family updates':['Doctor to call the family'],Belongings:['Belongings checked'],'Staff conduct':['Staff statement taken','Spoke to the staff member']};
function quick(c){const k=c.iss.map(i=>i.cat).concat([c.category]),o=[];k.forEach(x=>(QBY[x]||[]).forEach(q=>{if(o.indexOf(q)<0)o.push(q);}));const w=who(c);if(w.fam&&!(c.log||[]).some(e=>/family/i.test(e.t)))o.unshift('Spoke to family');return o.slice(0,4);}
/* who raised it, from the saved text (Patient / Family (rel) / Staff: name / a team / Anonymous) */
/* 25 Nov (Nikita): family details always in People; staff involved suggestions */
function famBox(c,W){const p=pts().find(q=>q.id===c.pid)||{};let F=(p.rels||[]).slice(0,2).map(r=>({n:r.name,rel:r.rel,ph:r.phone}));
  if(!F.length&&p.nr&&p.nr!=='Not recorded')F=[{n:p.nr,rel:p.nrRel||'Relative',ph:p.mobile||p.phone||''}];
  if(!F.length&&(p.gName||p.guardian))F=[{n:p.gName||p.guardian,rel:p.gRel||'Relative',ph:p.phone||''}];
  if(W.fam&&W.ph&&F.length&&!F.some(x=>x.ph))F[0].ph=W.ph;
  /* 25 Nov meeting: the family member who raised it is shown once, here, marked "Raised it" */
  if(W.fam){const nm=String(W.n||'').toLowerCase(),i=F.findIndex(x=>String(x.n||'').toLowerCase()===nm||(W.rel&&String(x.rel||'').toLowerCase()===String(W.rel).toLowerCase()));
    if(i>=0)F[i].raised=1;else F.unshift({n:W.n,rel:W.rel||'Family',ph:W.ph||'',raised:1});}
  {const seen={};F=F.filter(x=>{const k=String(x.ph||'').replace(/[^0-9]/g,'').slice(-10);if(!k)return true;if(seen[k]){return false;}seen[k]=1;return true;});}
  const tel=v=>String(v).replace(/[^0-9+]/g,'');
  return '<div class="fam"><div class="lbl" style="margin-top:12px">Family</div>'+(F.length?F.map(x=>'<div class="per"><span class="av">'+esc(ini(x.n))+'</span><div class="n"><b>'+esc(x.n)+'</b><span>'+esc(x.rel||'Relative')+(x.raised?' · raised it':'')+(x.ph?' · <a href="tel:'+esc(tel(x.ph))+'">'+esc(x.ph)+'</a>':' · no phone recorded')+'</span></div>'+(x.ph?'<button class="btn ic sm" data-a="call" aria-label="Call the family">📞</button>':'')+'</div>').join(''):'<div class="note" style="margin-top:4px">No family details in the patient record.</div>')+'</div>';}
function staffSug(c){const W=who(c),have=c.staff||[],L=[];if(W.t==='Staff'&&W.n&&W.n!=='Staff member')L.push(W.n);(c.iss||[]).forEach(i=>{const o=ownerName(c,i.owner);if(o&&!L.includes(o))L.push(o);});
  {const p=pts().find(q=>q.id===c.pid)||{};[p.doctor||p.dr,p.psych].forEach(n=>{if(n&&!L.includes(n))L.push(n);});}
  return L.filter(x=>!have.includes(x));}
function who(c){const r=String(c.raisedBy||'');const p=pts().find(q=>q.id===c.pid)||{};
  if(/^staff/i.test(r))return {t:'Staff',n:c.staffName||r.replace(/^Staff:?\s*/i,'')||'Staff member',fam:false};
  if(/^patient$/i.test(r))return {t:'Patient',n:c.name,fam:false,ph:p.phone||''};
  if(/^anonym/i.test(r))return {t:'Anonymous',n:'Anonymous',fam:false};
  if(/famil|husband|wife|father|mother|son|daughter|brother|sister/i.test(r))return {t:'Family',n:(p.gName||r),rel:c.raisedRel||(/\((.*)\)/.exec(r)||[])[1]||'',fam:true,ph:c.contact||p.phone||''};
  return {t:'Team',n:r||'Not recorded',fam:false};}
/* owner as a person: the treating psychiatrist's own name when the route says so */
/* 25 Nov (owner: "we are a hospital, not a hotel"): older saved grievances keep the old team names; they show with the hospital names */
const OLDN={'Kitchen supervisor':'Dietician','Housekeeping supervisor':'Housekeeping in-charge','Floor supervisor':'Floor coordinator','Billing desk':'Billing in-charge','Pharmacy desk':'Pharmacist'};
function ownerName(c,o){o=o||c.owner||'';o=OLDN[o]||o;const p=pts().find(q=>q.id===c.pid)||{};if(/treating psychiatrist/i.test(o)&&(p.doctor||p.dr))return p.doctor||p.dr;if(/treating psychologist/i.test(o)&&p.psych)return p.psych;return o;}
const ME='Patient Experience';
/* standalone (opened on its own, for testing): synthetic sample grievances, never saved */
const LOCAL={concernStatus:{},extraConcerns:[

function host(){try{const P=window.parent!==window&&window.parent.PXG;return (P&&P.self)||null;}catch(e){return null;}}
function hs(){const h=host();return h?h.state:LOCAL;}
/* patients: the app's own list first (its demo ids are p1, p2...), then the shared HMS list */
function pts(){let L=[];try{const h=host();if(h&&h.data)L=(h.data().P||[]).slice();}catch(e){}return L.concat((window.HMS_PATIENTS&&window.HMS_PATIENTS.patients)||[]);}
function all(){
  const s=hs(),cs=s.concernStatus||{},seen={},out=[];let seed=[];try{seed=(host()&&window.parent.PXG.seedList)||[];}catch(e){}
  seed.concat(s.extraConcerns||[]).forEach(c=>{if(!c||!c.id||seen[c.id])return;seen[c.id]=1;
    const x=Object.assign({},c,cs[c.id]||{}),p=pts().find(q=>q.id===c.pid)||{};
    x.name=p.name||c.pname||'Patient';x.room=p.room||c.room||'';x.ini=p.ini||'';
    x.ser=x.type==='grievance'||/safety|rights|security/i.test(x.category||'')||!!x.serious;
    x.st=typeof x.g2==='number'?x.g2:/Closed/i.test(x.status||'')?4:/Resolved/i.test(x.status||'')||x.stage==='confirm'?2:(x.findings&&x.findings.length)||(x.log&&x.log.length)?1:0;
    x.iss=(x.issues&&x.issues.length)?x.issues:[{t:x.title||'Concern',cat:x.category||'',when:x.logged||'',st:'Open',what:x.desc||'',fam:'',asks:[],owner:x.owner||''}];
    out.push(x);});

function patch(id,p,msg){V.keep=id;
  const h=host(),s=hs(),cs=Object.assign({},s.concernStatus||{});cs[id]=Object.assign({},cs[id]||{},p);

}
function stamp(){const d=new Date();return d.toLocaleDateString('en-IN',{weekday:'short'})+' '+d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}).toLowerCase();}
function addLog(c,k,t,extra){const e={k:k,t:t,by:ME,at:stamp(),ts:Date.now()};const log=(c.log||[]).concat([e]);
  const p=Object.assign({log:log,latest:(k==='Note'?'':k+': ')+t,latestBy:ME,latestAt:e.at},extra||{});
  if(/^Finding/.test(k))p.findings=(c.findings||[]).concat([{t:t,by:ME,at:e.at}]);
  if(c.st===0&&/^(Finding|Note)/.test(k)){p.g2=1;p.status=c.escalated?'Escalated':'Open';}
  return p;}

const ini=s=>String(s||'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';

function draw(){
  const L=all();let F=filt(L);
  /* 25 Nov (owner): an action on the open grievance (stage, issue, reminder) keeps that patient open; the list tab does not change */
  if(V.keep&&V.keep===V.sel&&!F.some(c=>c.id===V.sel)){const k=L.find(c=>c.id===V.keep);if(k)F=[k].concat(F);}
  if(!F.some(c=>c.id===V.sel))V.sel=F[0]?F[0].id:'';
  const cur=L.find(c=>c.id===V.sel);
  const n=k=>{const o=V.f;V.f=k;const r=filt(L).length;V.f=o;return r;};
  const tabs=[['open','Open'],['serious','Serious'],['confirm','To confirm with family'],['closed','Closed']].map(t=>'<button class="tab'+(t[0]==='serious'?' ser':'')+(V.f===t[0]?' on':'')+'" data-f="'+t[0]+'">'+t[1]+((t[0]==='open'||t[0]==='serious')&&n(t[0])?'<b>'+n(t[0])+'</b>':'')+'</button>').join('');
  const ae=document.activeElement,keep=ae&&ae.id?[ae.id,ae.selectionStart,ae.selectionEnd]:null;
  document.getElementById('root').innerHTML='<div class="wrap"><div class="bar"><label class="srch"><span aria-hidden="true">🔍</span><input id="gQ" placeholder="Search patient, room or G-number" aria-label="Search grievances" value="'+esc(V.q)+'"></label><div class="tabs" role="tablist">'+tabs+'</div><select class="srt" id="gSort" aria-label="Sort">'+[['new','Newest first'],['ser','Serious first'],['old','Oldest first']].map(o=>'<option value="'+o[0]+'"'+(V.sort===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></div>'
    +'<div class="list">'+tickets(F)+'</div><div>'+(L.length?detail(cur):'<div class="empty">No grievances logged yet. Use “Log a call or concern” at the top to log one.</div>')+'</div></div>';
  if(keep){const e=document.getElementById(keep[0]);if(e){e.focus();try{e.setSelectionRange(keep[1],keep[2]);}catch(x){}}}
}
function cur(){return all().find(c=>c.id===V.sel);}

function act(a,t){
  const c=cur(),h=host();
  if(a==='log'){if(h)h.setState({logOpen:true});else toast('Log a grievance from the app');return;}
  if(!c)return;
  if(a==='remind'){const n=(c.reminded||0)+1,at=stamp();patch(c.id,Object.assign(addLog(c,'Reminder','Reminded '+(c.owner||'the owner')+' to finish'),{reminded:n,remindedAt:at}),'Reminder sent to '+(c.owner||'the owner'));return;}
  if(a==='esc'){if(c.escalated){toast('Already raised to Mr. S. Chandra');return;}patch(c.id,Object.assign(addLog(c,'Escalated','Raised to Mr. S. Chandra (GM Operations)'),{escalated:true,escalatedAt:stamp(),status:c.st<2?'Escalated':c.status}),'Raised to Mr. S. Chandra');return;}
  if(a==='print'){window.print();return;}
  if(a==='call'){if(h)h.setState({logOpen:true,form:Object.assign({},h.state.form||{},{pid:c.pid||''})});else toast('Opens Log a call in the app');return;}
  if(a==='chart'){try{if(window.parent!==window){window.parent.postMessage({pxNav:'patients',pxOpen:c.name},'*');return;}}catch(x){}toast('Opens the patient record in the app');return;}
  if(a==='addiss'){V.form={k:-1,t:'',cat:'',when:'',what:'',fam:'',asks:'',owner:''};draw();return;}
  if(a==='fcancel'){V.form=null;draw();return;}
  if(a==='fsave'){const F=V.form;if(!F||!F.t.trim()){toast('Write what the family raised first');return;}
    const it={t:F.t.trim(),cat:F.cat,when:F.when,what:F.what,fam:F.fam,owner:F.owner,asks:String(F.asks||'').split(',').map(s=>s.trim()).filter(Boolean).map(s=>{const old=F.k>=0?(c.iss[F.k].asks||[]).find(a=>a.t===s):null;return {t:s,ok:!!(old&&old.ok)};}),st:F.k>=0?c.iss[F.k].st:'Open'};
    const iss=c.iss.slice();if(F.k>=0)iss[F.k]=it;else iss.push(it);V.form=null;setIss(c,iss,F.k>=0?'Issue saved':'Issue added');return;}
  if(a==='note'){const t=String(V.note||'').trim();if(!t){toast('Write the note first');return;}V.note='';
    const k=V.about==='General'?'Note':'Finding · '+V.about.replace('Issue ','');patch(c.id,addLog(c,k,t),'Added');return;}
  if(a==='staffadd'){V.staffAdd=true;V.staffTxt='';draw();const e=document.getElementById('gStaff');if(e)e.focus();return;}
  if(a==='staffok'){const t=String(V.staffTxt||'').trim();V.staffAdd=false;if(!t){draw();return;}patch(c.id,{staff:(c.staff||[]).concat([t])});return;}
}

function stgAsk(c,i){stgClose();const back=i<c.st,open=(c.iss||[]).filter(x=>(x.st||'Open')==='Open').length,saf=c.ser&&c.safety?Object.keys(c.safety).length:0;

    +(i===4&&who(c).fam&&c.st<3?'<div class="sgw">The family raised this. Tell them what was done (Family communicated) before closing.</div>':'')
    +'<label><span>Note for the log <span style="font-weight:400;color:#667085">(optional)</span></span><textarea id="sgN" placeholder="'+(back?'Why it is moving back':'What was done')+'"></textarea></label>'
    +'<div class="sgb"><button class="btn" id="sgX">Cancel</button><button class="btn pri" id="sgY">'+(back?'Move back':'Move to '+esc(STAGES[i]))+'</button></div></div>';
  document.body.appendChild(o);const y=o.querySelector('#sgY');y.focus();
  o.addEventListener('click',e=>{if(e.target===o||e.target.id==='sgX'){e.stopPropagation();stgClose();}else if(e.target.id==='sgY'){e.stopPropagation();let n=(o.querySelector('#sgN').value||'').trim();const si=o.querySelector('#sgI');if(si){const v=si.value;n=(v==='all'?'All issues':'Issue '+(+v+1)+': '+(c.iss[+v].t||''))+(n?' · '+n:'');}stgClose();stgDo(c,i,n);}});
  o.addEventListener('keydown',e=>{if(e.key==='Escape'){stgClose();}else if(e.key==='Tab'){const f=[...o.querySelectorAll('textarea,button')];const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}});
  stgAsk.back=document.querySelector('.stp[data-stg="'+i+'"]');}
function stgClose(){const o=document.getElementById('sgo');if(o)o.remove();}
/* 25 Nov (owner: "these pop-up details must be saved"): every confirmed move is kept as a stage record on the grievance
   (concernStatus[id].stages = [{from,to,note,open,by,at,ts}]), next to the log entry. In the lead app this is in the grievance's
   pxg:<id> row of px_state (the shared database), so it is there after a reload and on every computer. */
function stgDo(c,i,n){const open=(c.iss||[]).filter(x=>(x.st||'Open')==='Open').length;
  const rec={from:STAGES[c.st],to:STAGES[i],note:n||'',open:i>=2?open:0,by:ME,at:stamp(),ts:Date.now()};
  patch(c.id,Object.assign(addLog(c,'Stage','Moved to '+STAGES[i]+(n?': '+n:''),{g2:i}),{g2:i,status:i<2?(c.escalated?'Escalated':'Open'):i<4?'Resolved':'Closed',stages:(c.stages||[]).concat([rec])}),'Saved: moved to '+STAGES[i]);}
function stgHist(c){const L=(c.stages||[]).slice().reverse();if(!L.length)return '';const r=x=>'<li><div><b>'+esc(x.from)+'</b> <span class="ar">→</span> <b>'+esc(x.to)+'</b>'+(x.open?' <span class="sgo-w">'+x.open+' issue'+(x.open>1?'s':'')+' still open</span>':'')+'</div>'+(x.note?'<div class="nt">'+esc(x.note)+'</div>':'')+'<div class="by">'+esc(x.by)+' · '+esc(x.at)+'</div></li>';
  return '<details class="sgh"'+(V.sgh===c.id?' open':'')+'><summary>Stage history · '+L.length+'<span>Last: '+esc(L[0].to)+', '+esc(L[0].by)+', '+esc(L[0].at)+'</span></summary><ol>'+L.map(r).join('')+'</ol></details>';}
document.addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('sgh')){const c=cur();V.sgh=d.open&&c?c.id:'';}},true);
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const c=cur(),d=t.dataset;
  if(d.f){V.f=d.f;V.keep="";V.form=null;draw();return;}
  if(d.sel){V.sel=d.sel;V.keep="";V.form=null;V.about='General';draw();return;}
  if(d.a){act(d.a,t);return;}
  if(!c)return;
  if(d.stg!==undefined){const i=+d.stg;if(i===c.st)return;stgAsk(c,i);return;}
  if(d.saf!==undefined){const S=Object.assign({},c.safety||{}),i=+d.saf;if(S[i])delete S[i];else S[i]={by:ME,at:stamp()};patch(c.id,{safety:S});return;}
  if(d.ist!==undefined){const iss=c.iss.map(x=>Object.assign({},x));iss[+d.ist].st=d.v;patch(c.id,Object.assign(addLog(c,'Issue','Issue '+(1+ +d.ist)+' ('+(iss[+d.ist].t||'')+') marked '+d.v),{issues:iss}),'Issue '+(1+ +d.ist)+': '+d.v);return;}
  if(d.ask){const p=d.ask.split(':'),iss=c.iss.map(x=>Object.assign({},x,{asks:(x.asks||[]).map(a=>Object.assign({},a))})),a=iss[+p[0]].asks[+p[1]];a.ok=!a.ok;setIss(c,iss);return;}
  if(d.ied!==undefined){const i=c.iss[+d.ied];V.form={k:+d.ied,t:i.t||'',cat:i.cat||'',when:i.when||'',what:i.what||'',fam:i.fam||'',asks:(i.asks||[]).map(a=>a.t).join(', '),owner:i.owner||''};draw();return;}
  if(d.about){V.about=d.about;draw();return;}
  if(d.quick){V.note=d.quick+(V.note?': '+V.note:'');draw();const e=document.getElementById('gNote');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length);}return;}
  if(d.sugstaff){patch(c.id,{staff:(c.staff||[]).concat(d.sugstaff)},'Added');return;}
  if(d.unstaff!==undefined){const s=(c.staff||[]).slice();s.splice(+d.unstaff,1);patch(c.id,{staff:s});return;}
});
/* the app may hand over which grievance to open (Reports sets px_gopen before switching here) */
function gOpen(id){V.sel=id;const c=all().find(x=>x.id===id);V.f=c?(c.st>=4?'closed':c.st>=2?'confirm':'open'):'open';}
try{const g=localStorage.getItem('px_gopen');if(g){localStorage.removeItem('px_gopen');gOpen(g);}}catch(e){}
window.addEventListener('message',e=>{const d=e&&e.data;if(d&&d.gOpen){V.sel=d.gOpen;V.f='open';const c=all().find(x=>x.id===d.gOpen);if(c)V.f=c.st>=4?'closed':c.st>=2?'confirm':'open';draw();}});
/* new grievances from other computers arrive in the app every 20 s: redraw, unless something is being typed */
setInterval(()=>{const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;draw();},5000);
draw();
})();
</script>
