<!doctype html>
<html lang="en">
<head><script src="/auth-shim.js"></script><script src="/px/px-real.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tulasi · Patient Experience · Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6FBFF;--card:#fff;--line:#E3EAF2;--ink:#0F172A;--ink2:#344054;--mute:#667085;--blue:#1E6CDB;--blue-d:#1E5BB8;--track:#EEF2F6;--tick:#475467;--low:#F59E0B;--red:#B42318;--green:#067647}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14.5px;line-height:1.45}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
main{padding:14px 16px 48px;display:flex;flex-direction:column;gap:14px}

/* Top bar */
.hello{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
.hello p{margin:0;font-size:14.5px;color:var(--ink2)}
.hello small{display:block;margin-top:2px;font-size:12.5px;color:var(--mute)}
.ctrls{display:flex;flex-wrap:wrap;gap:10px}

/* Segmented controls */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:8px 16px;font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--blue);color:#fff}
.btn{height:40px;display:inline-flex;align-items:center;gap:8px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:14px;font-weight:600}
.btn:hover{background:#f8fafc}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;transition:border-color .15s}
.kpi:hover{border-color:#c7d2e0}
.kpi .lab{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.kpi .num{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.kpi .num b{font-size:28px;font-weight:700;letter-spacing:-.02em}
.kpi .num span{font-size:16px;color:var(--ink2);font-weight:500}
.kpi .meta{font-size:13px;color:var(--mute)}
.kpi .def{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--track);font-size:13px;color:var(--ink2)}
.kpi.open .def{display:block}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ch{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ch h3{margin:0;font-size:16px;font-weight:700}
.ch small{font-size:13px;color:var(--ink2)}

/* Needs attention rows */
.att{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:12px 18px;border:0;border-top:1px solid var(--track);background:#fff;text-align:left;font-size:14.5px;cursor:pointer}
.att:first-child{border-top:0}
.att:hover{background:#fafbfd}
.att b{font-size:14.5px}
.att .c{display:flex;align-items:center;gap:10px}
.att .k{min-width:28px;text-align:right;font-weight:700;font-size:16px}
.sub-att{display:none;padding:4px 18px 12px 18px;background:#fafbfd}
.sub-att.on{display:block}
.sub-att div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13px;color:var(--ink2);border-top:1px dashed var(--line)}
.sub-att div:first-child{border-top:0}
.chev{transition:transform .15s;display:inline-block}
.att[aria-expanded=true] .chev{transform:rotate(180deg)}

/* Team bars */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;font-weight:600;color:var(--ink2)}
.tabs button.on{border-color:var(--blue);color:var(--blue-d);background:#EFF6FF}
.row{display:grid;grid-template-columns:200px minmax(0,1fr) 140px;align-items:center;gap:16px;padding:11px 18px;border-top:1px solid var(--track)}
.row:first-of-type{border-top:0}
.row .n{font-size:14.5px}
.track{position:relative;height:9px;border-radius:999px;background:var(--track)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.track em{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--tick);border-radius:1px;opacity:.6}
.row .v{text-align:right;font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums}
.row .v small{font-weight:500;color:var(--mute);font-size:12.5px;margin-right:6px}
.row.tot{background:#fafbfd}
.row.tot .n{font-weight:700}

/* Bottom two columns */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}.two>.card{margin:0}.two .row{grid-template-columns:150px minmax(0,1fr) 96px;gap:12px}.sub-att .go{cursor:pointer}.sub-att .go:hover{background:#EEF4FD}.sub-att .go:hover span:first-child{color:#1e6cdb;text-decoration:underline}
.li{display:flex;justify-content:space-between;gap:12px;padding:11px 18px;border-top:1px solid var(--track);font-size:14px}
.li:first-child{border-top:0}
.li span:last-child{color:var(--ink2);white-space:nowrap}
.q{padding:11px 18px;border-top:1px solid var(--track);font-size:14px;color:var(--ink2)}
.q:first-child{border-top:0}
.q small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;border-radius:10px;padding:10px 16px;font-size:13.5px;z-index:80;box-shadow:0 8px 20px rgba(0,0,0,.25)}

@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.two{grid-template-columns:1fr}.row{grid-template-columns:140px minmax(0,1fr) 110px;gap:12px}}
@media(max-width:640px){main{padding:8px 6px 32px!important}.kpis{grid-template-columns:1fr}}
html.embed body{background:transparent}
</style>
</head>
<body>
<main id="root"></main>
<script src="px-store.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Patient Experience · Reports (redesigned 23 Nov 2026)
   ───────────────────────────────────────────────────────────────────────────
   One page for the whole team. Everyone sees everyone's numbers.
   Every number is a rate against a due count from the HMS.
   See the HTML mockup spec for full definitions.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── date helpers ── */
const MN3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WK=(function(){const t=new Date();t.setHours(0,0,0,0);const m=new Date(t);m.setDate(t.getDate()-((t.getDay()+6)%7));const e=new Date(m);e.setDate(m.getDate()+6);return 'This week, '+m.getDate()+(m.getMonth()!==e.getMonth()?' '+MN3[m.getMonth()]:'')+' to '+e.getDate()+' '+MN3[e.getMonth()]+' '+e.getFullYear();})();
const MO=(function(){const t=new Date(),a=new Date(t.getFullYear(),t.getMonth()-1,1),b=new Date(t.getFullYear(),t.getMonth(),0);return 'Last month, 1 to '+b.getDate()+' '+MN3[a.getMonth()]+' '+a.getFullYear();})();
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pc=(a,b)=>b?Math.round(a/b*100):0;

/* ── state ── */
let S={per:0, site:0, m:'adm'};
const PER=['This week','Last month'];
const SITE=['Both sites','Mehrauli','Gurgaon'];
const RANGE=[WK, MO];

/* ── measures ── */
const M={
  adm:{l:'Admission steps on time',u:'admissions',t:95,d:'Family met and rights explained, both within 24 h of admission. Out of admissions in the period.'},
  calls:{l:'Weekly calls done',u:'calls due',t:90,d:'Weekly family update calls done by their due date. One is due per patient per 7 days of stay.'},
  fb:{l:'Discharge feedback taken',u:'discharges',t:80,d:'Feedback form saved within 48 h of discharge. Out of discharges minus LAMA and transfers.'},
  gr:{l:'Grievances on time',u:'grievances due',t:90,d:'Resolved within the severity deadline: Routine 6 h, Priority 24 h, Serious 72 h.'}
};
const KEYS=['adm','calls','fb','gr'];

/* ── team data (sample) ── */
const PEOPLE=[
  {n:'Prabha',  s:'Mehrauli',adm:[[14,15],[55,61]],calls:[[42,44],[160,176]],fb:[[7,9],[27,35]],gr:[[5,6],[17,21]]},
  {n:'Grisham', s:'Gurgaon', adm:[[13,14],[50,58]],calls:[[40,44],[150,176]],fb:[[6,8],[24,32]],gr:[[4,6],[15,20]]},
  {n:'Kanika',  s:'Mehrauli',adm:[[13,15],[49,59]],calls:[[36,44],[139,176]],fb:[[6,9],[22,33]],gr:[[5,6],[16,21]]}
];
const PREV={adm:[86,84],calls:[81,84],fb:[70,69],gr:[78,77]};

/* ── needs attention (always live) ── */
const ATT=[
  {l:'Overdue grievances',red:1,items:[['G-0007 · Room 214','Grisham · 3 h over'],['G-0011 · Room 108','Kanika · 1 h over']]},
  {l:'Serious cases open',red:1,items:[['G-0003 · Room 116','Floor lead psychiatrist · checklist 2 of 6']]},
  {l:'Weekly calls due today',items:[['Room 103','Prabha'],['Room 109','Prabha'],['Room 221','Grisham'],['Room 112','Kanika']]},
  {l:'Families not met yet',items:[['Room 118','Kanika · admitted 18 h ago'],['Room 230','Grisham · admitted 9 h ago']]}
];

/* ── bottom cards ── */
const RAISE=[['Room and housekeeping',6,4],['Billing and insurance',4,5],['Food',3,3],['Staff behaviour',2,1],['Ward rules and requests',2,3]];
const ROOT=[['Maintenance fault, 4 times','Sent to Maintenance'],['Call centre gave wrong information, 3 times','Sent to Call centre']];
const COMPL=[
  {room:'204',words:'The doctor explained everything patiently and the nursing team was always available at night.',who:'Dr [name] and the night nursing team'},
  {room:'117',words:'Prabha called us every week without fail. We always knew how our son was doing.',who:'Prabha'},
  {room:'302',words:'The food was always warm and they adjusted the menu when we asked.',who:'the kitchen team'}
];

/* ── real mode: count what is logged in this app ── */
if(window.PX_REAL){
  const J=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||'null')||d;}catch(e){return d;}};
  const pts=(window.HMS_PATIENTS&&window.HMS_PATIENTS.patients)||[],now=Date.now(),D=864e5,LEN=[7,30];
  const steps=J('px_steps_v1',{}),calls=J('px_calls_v1',[]),gone=J('px_gone_v1',{});
  const admT=h=>h.adm?new Date(h.adm).getTime():NaN;
  const called=(id,from,to)=>calls.some(c=>c.pid===id&&c.outcome==='Connected'&&(t=>t>=from&&t<to)(new Date(c.at).getTime()));
  let st=null;try{const P=window.parent&&window.parent!==window&&window.parent.PXG;st=P&&P.self&&P.self.state;}catch(e){}
  const cs=(st&&st.concernStatus)||{},con=((st&&st.extraConcerns)||[]).map(c=>Object.assign({},c,cs[c.id]||{}));
  const fig=k=>LEN.map(n=>{const from=now-n*D;
    if(k==='adm'){const L=pts.filter(h=>admT(h)>=from);return [L.filter(h=>steps[h.id+0]&&steps[h.id+3]).length,L.length];}
    if(k==='calls'){let due=0,ok=0;pts.forEach(h=>{const a=admT(h),start=isNaN(a)?from:Math.max(a,from),w=Math.floor((now-start)/(7*D));if(w>0){due+=w;ok+=Math.min(w,calls.filter(c=>c.pid===h.id&&c.outcome==='Connected'&&new Date(c.at).getTime()>=start).length);}});return [ok,due];}
    if(k==='fb'){const L=Object.keys(gone).filter(id=>gone[id].gone>=from);return [L.filter(id=>(J('px_dc_'+id,{}).fb||{}).on).length,L.length];}
    const L=con.filter(c=>(c.at||0)>=from);return [L.filter(c=>/Resolved|Closed/i.test(c.status||'')).length,L.length];});
  PEOPLE.length=0;
  PEOPLE.push(Object.assign({n:'Patient Experience (one shared login)',s:'Gurgaon'},Object.fromEntries(KEYS.map(k=>[k,fig(k)]))));
  KEYS.forEach(k=>{PREV[k]=[null,null];});
  const nm=h=>esc(h.name||'Patient')+(h.room?' · Room '+esc(String(h.room).replace(/^Room\s*/,'')):'');
  const open=con.filter(c=>!/Resolved|Closed/i.test(c.status||''));
  const pn=c=>{const h=pts.find(x=>x.id===c.pid);return c.id+' · '+((h&&h.name)||c.pname||'Patient')+((h&&h.room)?' · Room '+String(h.room).replace(/^Room\s*/,''):'');};
  ATT[0].items=open.filter(c=>c.at&&now-c.at>6*36e5).map(c=>[esc(pn(c)),esc((c.owner||'owner')+' · '+Math.round((now-c.at-6*36e5)/36e5)+' h over'),'g:'+c.id]);
  ATT[1].items=open.filter(c=>/safety|rights|serious/i.test((c.category||'')+' '+(c.severity||''))).map(c=>[esc(pn(c)),esc(c.owner||''),'g:'+c.id]);
  ATT[2].items=pts.filter(h=>{const a=admT(h);return !isNaN(a)&&now-a>=7*D&&!called(h.id,now-7*D,now+1);}).map(h=>[nm(h),'no call in 7 days','p:'+(h.name||'')]);
  ATT[3].items=pts.filter(h=>{const a=admT(h);return !isNaN(a)&&now-a<2*D&&!steps[h.id+0];}).map(h=>[nm(h),'admitted '+Math.max(1,Math.round((now-admT(h))/36e5))+' h ago','p:'+(h.name||'')]);
  RAISE.length=0; ROOT.length=0; COMPL.length=0;
  /* 24 Nov (Nikita): what families keep raising = real categories, last 30 days against the 30 before */
  const rc={};con.forEach(c=>{const t=c.at||0,k=now-t<30*D?1:now-t<60*D?2:0;if(!k)return;const cats=(c.issues&&c.issues.length?c.issues.map(i=>i.cat):[c.category]).filter(Boolean);[...new Set(cats)].forEach(x=>{rc[x]=rc[x]||[x,0,0];rc[x][k]++;});});
  Object.values(rc).filter(r=>r[1]).sort((x,y)=>y[1]-x[1]).forEach(r=>RAISE.push(r));
}

/* ── helpers ── */
function people(){return S.site===0?PEOPLE:PEOPLE.filter(p=>p.s===SITE[S.site]);}
function tot(k){let a=0,b=0;people().forEach(p=>{a+=p[k][S.per][0];b+=p[k][S.per][1];});return[a,b];}

const CH='<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>';

function bar(a,t){
  const p=pc(a[0],a[1]);
  return '<div class="track"><i style="width:'+Math.max(p,1)+'%;background:'+(p>=t?'var(--blue)':'var(--low)')+'"></i><em style="left:'+t+'%"></em></div>';
}

/* ── download ── */
function csv(){
  const rows=[['Patient Experience Report',PER[S.per],RANGE[S.per],SITE[S.site]],[]];
  rows.push(['Measure','Done','Of','Rate %','Target %','Change pts']);
  KEYS.forEach(k=>{const a=tot(k),p=pc(a[0],a[1]),d=PREV[k][S.per]==null?'':p-PREV[k][S.per];rows.push([M[k].l,a[0],a[1],p,M[k].t,d]);});
  rows.push([]);
  rows.push(['Team member','Measure','Done','Of','Rate %']);
  people().forEach(person=>{KEYS.forEach(k=>{const a=person[k][S.per];rows.push([person.n,M[k].l,a[0],a[1],pc(a[0],a[1])]);});});
  rows.push([]);
  rows.push(['Needs attention now','Count']);
  ATT.forEach(a=>rows.push([a.l,a.items.length]));
  rows.push([]);
  rows.push(['What families keep raising','Count','Change']);
  RAISE.forEach(r=>rows.push([r[0],r[1],r[1]-r[2]]));

  const text=rows.map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv'}));
  a.download='PX_Report_'+SITE[S.site].replace(/\s+/g,'_')+'_'+PER[S.per].replace(/\s+/g,'_')+'.csv';
  document.body.appendChild(a);a.click();a.remove();
  toast('Downloaded for ops review (opens in Excel)');
}

function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3000);}

/* ── render ── */
function render(){
  const root=document.getElementById('root');

  /* Period & site segmented controls */
  const segBtn=(list,key)=>list.map((l,i)=>'<button class="'+(S[key]===i?'on':'')+'" data-seg="'+key+'" data-i="'+i+'">'+l+'</button>').join('');

  /* KPI cards */
  const kpis=KEYS.map(k=>{
    const a=tot(k), p=pc(a[0],a[1]), prev=PREV[k][S.per], d=p-prev, m=M[k];
    const rateColor=p>=m.t?'var(--ink)':'#B54708';
    const changeText=prev==null?'No earlier '+(S.per?'month':'week')+' to compare yet':(d>=0?'Up ':'Down ')+Math.abs(d)+' pts from last '+(S.per?'month':'week');
    return '<button class="kpi" aria-expanded="false">'+
      '<span class="lab">'+m.l+'</span>'+
      '<span class="num"><b>'+a[0]+'</b><span>of '+a[1]+'</span></span>'+
      '<span class="meta"><b style="color:'+rateColor+'">'+p+'%</b> · target '+m.t+'%</span>'+
      '<span class="meta">'+changeText+'</span>'+
      '<span class="def">'+m.d+'</span>'+
    '</button>';
  }).join('');

  /* Needs attention now */
  const attRows=ATT.map((a,i)=>{
    const n=a.items.length;
    const countColor=a.red&&n?'var(--red)':'var(--ink)';
    return '<button class="att" aria-expanded="false" data-att="'+i+'">'+
      '<span>'+a.l+'</span>'+
      '<span class="c"><span class="k" style="color:'+countColor+'">'+n+'</span>'+CH+'</span>'+
    '</button>'+
    '<div class="sub-att" id="sub'+i+'">'+
      (n?a.items.map(x=>'<div'+(x[2]?' class="go" role="button" tabindex="0" data-go="'+esc(x[2])+'" title="'+(x[2][0]==='g'?'Open this grievance':'Open the patient')+'"':'')+'><span>'+x[0]+'</span><span>'+x[1]+(x[2]?' ›':'')+'</span></div>').join(''):'<div><span style="color:var(--mute)">None</span><span></span></div>')+
    '</div>';
  }).join('');

  /* Team tabs & bars */
  const tabBtns=KEYS.map(k=>{
    const shortLabel=M[k].l.replace(' on time','').replace(' done','').replace(' taken','');
    return '<button class="'+(S.m===k?'on':'')+'" data-mtab="'+k+'">'+shortLabel+'</button>';
  }).join('');

  const k=S.m, t=M[k].t;
  const teamRows=people().map(p=>{
    const a=p[k][S.per], pct=pc(a[0],a[1]);
    if(a[1]<5) return '<div class="row"><span class="n">'+p.n+'</span><span style="font-size:13px;color:var(--mute)">Too few to rate ('+a[1]+')</span><span class="v"></span></div>';
    return '<div class="row"><span class="n">'+p.n+'</span>'+bar(a,t)+'<span class="v"><small>'+a[0]+' of '+a[1]+'</small>'+pct+'%</span></div>';
  }).join('');

  const totA=tot(k), totPct=pc(totA[0],totA[1]);
  const teamTotal='<div class="row tot"><span class="n">Team</span>'+bar(totA,t)+'<span class="v"><small>'+totA[0]+' of '+totA[1]+'</small>'+totPct+'%</span></div>';
  const teamLegend='<div style="padding:8px 18px 12px;font-size:12.5px;color:var(--mute)">The line is the '+t+'% target. Orange is below it.</div>';

  /* What families keep raising */
  const raiseRows=RAISE.map(r=>{
    const d=r[1]-r[2];
    return '<div class="li"><span>'+esc(r[0])+'</span><span><b style="color:var(--ink)">'+r[1]+'</b> &nbsp;'+(d===0?'same':(d>0?'up '+d:'down '+(-d)))+'</span></div>';
  }).join('');
  const rootRows=ROOT.map(r=>'<div class="li" style="background:#FFFAF0"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>').join('');

  /* Compliments */
  let npsText='Discharge NPS 42 from 19 answers';
  if(window.PX_REAL){const sc=Object.keys(localStorage).filter(x=>x.indexOf('px_dc_')===0).map(x=>{try{return (JSON.parse(localStorage.getItem(x))||{}).form||{};}catch(e){return {};}}).filter(f=>f.fbScore!==undefined&&f.fbScore!=='').map(f=>+f.fbScore);
    npsText=sc.length?'Discharge NPS '+Math.round((sc.filter(v=>v>=9).length-sc.filter(v=>v<=6).length)/sc.length*100)+' from '+sc.length+' answer'+(sc.length===1?'':'s'):'Discharge NPS: no answers yet';}
  const compRows=COMPL.length?COMPL.map(c=>
    '<div class="q">'+(window.PX_REAL?esc(c.words):c.words)+'<small>Room '+c.room+' · names '+c.who+'</small></div>'
  ).join(''):'<div class="q" style="color:var(--mute)">No compliments logged yet.</div>';

  /* Assemble */
  root.innerHTML=
  '<div class="hello">'+
    '<div><p id="range">'+RANGE[S.per]+'. Everyone on the team sees this page.</p>'+
    '<small>Counted from what is logged in the HMS.'+(window.PX_REAL?'':' Sample numbers in this mockup.')+'</small></div>'+
    '<div class="ctrls">'+
      '<div class="seg" role="radiogroup" aria-label="Period">'+segBtn(PER,'per')+'</div>'+
      
    '</div>'+
  '</div>'+

  '<div class="kpis">'+kpis+'</div>'+

  '<div class="two">'+
  '<div class="card">'+
    '<div class="ch"><h3>Needs attention now</h3><small>Click to see the list</small></div>'+
    '<div id="att">'+attRows+'</div>'+
  '</div>'+

  '<div class="card">'+
    '<div class="ch"><h3>Team</h3><div class="tabs" role="radiogroup" aria-label="Measure">'+tabBtns+'</div></div>'+
    '<div id="team">'+teamRows+teamTotal+teamLegend+'</div>'+
  '</div>'+
  '</div>'+

  '<div class="two">'+
    '<div class="card">'+
      '<div class="ch"><h3>What families keep raising</h3><small>'+(window.PX_REAL?'From grievances, last 30 days':'From grievances')+'</small></div>'+
      '<div id="raise">'+((raiseRows+rootRows)||'<div class="li"><span class="muted" style="color:var(--mut,#667085)">No complaints logged in the last 30 days.</span></div>')+'</div>'+
    '</div>'+
    '<div class="card">'+
      '<div class="ch"><h3>Compliments to pass on</h3><small>'+npsText+'</small></div>'+
      '<div id="comp">'+compRows+'</div>'+
    '</div>'+
  '</div>';
}

/* ── events ── */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){const v=g.dataset.go,id=v.slice(2);
    if(v[0]==='g'){try{localStorage.setItem('px_gopen',id);}catch(x){}try{if(window.parent!==window){window.parent.postMessage({pxNav:'grievances'},'*');return;}}catch(x){}location.href='grievances.html';}
    else{try{if(window.parent!==window){window.parent.postMessage({pxNav:'patients',pxOpen:id},'*');return;}}catch(x){}try{localStorage.setItem('pxopen',id);}catch(x){}location.href='patients.html';}
    return;}
  const t=e.target.closest('[data-seg],[data-att],[data-mtab],[data-dl]');
  if(!t) {
    /* KPI card expand/collapse */
    const kpi=e.target.closest('.kpi');
    if(kpi){kpi.classList.toggle('open');kpi.setAttribute('aria-expanded',kpi.classList.contains('open'));}
    return;
  }
  if(t.dataset.seg){
    S[t.dataset.seg]=+t.dataset.i;
    render();
  } else if(t.dataset.att!==undefined){
    const sub=document.getElementById('sub'+t.dataset.att);
    const on=!sub.classList.contains('on');
    sub.classList.toggle('on',on);
    t.setAttribute('aria-expanded',on);
  } else if(t.dataset.mtab){
    S.m=t.dataset.mtab;
    render();
  } else if(t.dataset.dl!==undefined){
    csv();
  }
});

if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add('embed');
render();
</script>
</body>
</html>
