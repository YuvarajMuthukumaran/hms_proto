<style>

a{color:#1E5BB8;text-decoration:none}

.app{display:flex;min-height:100vh}
.side{width:264px;flex-shrink:0;background:#fff;border-right:1px solid #E3EAF2;padding:18px 14px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:700;font-size:16px}
.brand i{width:34px;height:34px;border-radius:999px;background:#E8F1FE;display:flex;align-items:center;justify-content:center;color:#1E6CDB}
.mm{font-size:12px;font-weight:600;letter-spacing:.05em;color:#667085;padding:0 10px 8px;border-bottom:1px solid #EEF2F6;margin-bottom:6px}

.sub{border:1px solid #E3EAF2;border-radius:14px;padding:6px;margin:6px 0;display:flex;flex-direction:column;gap:2px}
.sub a{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-radius:12px;color:#344054;font-weight:500}

.bd{font-size:12px;font-weight:600;background:#FFF4D6;color:#93370D;border-radius:999px;padding:1px 8px}
.me{display:flex;align-items:center;gap:10px;border:1px solid #E3EAF2;border-radius:12px;padding:10px;margin-top:auto}
.av{border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.col{flex:1;min-width:0;display:flex;flex-direction:column}

main{padding:14px 16px 48px;display:flex;flex-direction:column;gap:14px}

.btn.pri{background:#1E6CDB;border-color:#1E6CDB;color:#fff}

.tw{overflow-x:auto}

.tag{font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;background:#F2F4F7;border:1px solid #E4E7EC;color:#475467}

.key span{display:flex;align-items:center;gap:6px}.key .dot{margin:0}
.rev{position:fixed;right:16px;bottom:16px;z-index:20;display:flex;gap:4px;background:#0F172A;padding:5px;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.rev button{border:0;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;background:transparent;color:#CBD5E1}

.doc{max-width:1200px;margin:0 auto;padding:32px 24px 90px}
.doc h2{margin:6px 0 6px;font-size:26px}

.gt{display:grid;border:1px solid #E2E8F0;border-radius:12px;overflow:hidden;background:#fff}

.gt>div:first-child{border-top:0;background:#F1F5F9;font-size:12px;font-weight:700;letter-spacing:.05em;color:#334155}

<body>
<div id="root"></div><div id="cm"></div>
<div class="rev" role="tablist" aria-label="Review views">
  <button data-v="today" class="on">Today (proposed)</button>
  <button data-v="cmp">Live vs proposed</button>
  <button data-v="trk">Ops tracker to HMS</button>
</div>
<script>
/* Random family call pop-up, shared by Today and Patients */
const CM = { open:false, p:null, outcome:null, ans:{}, action:null, cat:null, safety:false, compl:false, words:'', concern:'', who:null, n:1, gid:147 };
const CM_Q = [
  ['q1','How do you feel he/she is being looked after?',['Very happy','Happy','Okay','Not happy']],
  ['q2','Do the 8 pm updates tell you what you want to know?',['Yes, useful','Too general, want more detail','Not every day','Not getting them']],
  ['q3','Has the doctor spoken to you this week?',['Yes','No','Only the psychologist']],
  ['q4','Do you understand how treatment is going and when to expect change?',['Yes','Not sure','No change seen, worried']],
  ['q5','Has the psychologist changed, or were sessions missed (weekends, leave)?',['No','Yes']],
  ['q6','Anything about food, room, cleanliness or billing?',['Nothing','Food','Room or cleanliness','Billing']],
  ['q7','Any worry about how staff treat him/her, or anything that happened (fall, injury, force)?',['No concern','Yes, a concern']]
];
const CM_OWN = p => ({
  'Family updates':['Psychology team lead','6 h'],
  'Doctor communication':[p.dr||'Treating psychiatrist','6 h'],
  'Treatment progress':[(p.dr||'Treating psychiatrist')+' (family meeting)','6 h'],
  'Therapist continuity':['Psychology team lead','6 h'],
  'Billing and insurance':['Billing desk','6 h'],
  'Food and dietary':['Kitchen supervisor','6 h'],
  'Room and housekeeping':['Housekeeping supervisor','6 h'],
  'Rights':['Kanika and Chandraji','6 h'],
  'Safety':['Chandraji and treating doctor','now'],
  'Other':['Kanika','6 h']
});
function cmSuggest(){
  const a=CM.ans;
  if(a.q7==='Yes, a concern') return 'Safety';
  if(a.q2&&a.q2!=='Yes, useful') return 'Family updates';
  if(a.q3==='No'||a.q3==='Only the psychologist') return 'Doctor communication';
  if(a.q4==='No change seen, worried') return 'Treatment progress';
  if(a.q5==='Yes') return 'Therapist continuity';
  if(a.q6==='Billing') return 'Billing and insurance';
  if(a.q6==='Food') return 'Food and dietary';
  if(a.q6==='Room or cleanliness') return 'Room and housekeeping';
  if(a.q1==='Not happy') return 'Other';
  return null;
}

function openCall(p, n){ Object.assign(CM,{open:true,p:p||null,outcome:null,ans:{},action:null,cat:null,safety:false,compl:false,words:'',concern:'',who:p?p.rep:null,n:n||1}); drawCM(); }
function cmChip(group,val,cur){ const on=cur===val; return `<button type="button" data-cm="${group}" data-val="${esc(val)}" style="height:32px;padding:0 12px;border-radius:999px;border:1px solid ${on?'#1E6CDB':'#D6DEE8'};background:${on?'#E8F1FE':'#fff'};color:${on?'#1E5BB8':'#344054'};font-size:13px;font-weight:600">${esc(val)}</button>`; }
function drawCM(){
  const el=document.getElementById('cm'); if(!el) return;
  if(!CM.open){ el.innerHTML=''; return; }
  const p=CM.p; const pats=(window.CM_PATIENTS||[]);
  const sug=cmSuggest(); if(CM.action===null && sug){ CM.action='yes'; CM.cat=sug; CM.safety=sug==='Safety'; }
  const own=p?CM_OWN(p):{}; const o=CM.cat?own[CM.cat]:null;
  const head = p ? `<div><div style="font-size:12px;font-weight:700;letter-spacing:.05em;color:#1D4ED8">RANDOM FAMILY CALL ${CM.n} OF 2</div><b style="font-size:18px">${esc(p.name)}</b><div style="font-size:13px;color:#667085">${esc(p.rep)} (${esc(p.rel)}) · ${esc(p.ph||'')} · Day ${p.day} · Room ${esc(p.room)}</div></div>`
    : `<div><div style="font-size:12px;font-weight:700;letter-spacing:.05em;color:#1D4ED8">LOG A FAMILY CALL</div><label style="display:flex;flex-direction:column;gap:6px;font-size:13px;margin-top:6px">Patient<select data-cmpick="1" class="inp" style="width:320px"><option value="">Choose a patient</option>${pats.map(x=>`<option value="${x.id}">${esc(x.name)} · Room ${esc(x.room)}</option>`).join('')}</select></label></div>`;
  let body='';
  if(p){
    body += `<div style="display:flex;flex-direction:column;gap:8px"><b style="font-size:14px">Did they pick up?</b><div style="display:flex;flex-wrap:wrap;gap:6px">${['Connected','No answer','Asked to call later'].map(v=>cmChip('outcome',v,CM.outcome)).join('')}</div></div>`;
    if(CM.outcome && CM.outcome!=='Connected') body += `<div style="background:#F8FAFC;border-radius:10px;padding:10px 12px;font-size:13px;color:#475467">Saved as attempt ${CM.outcome==='No answer'?'1 · no answer':'1 · asked to call later'}. It comes back on Today tomorrow at the same time. After 2 missed attempts, the backup contact is suggested.</div>`;
    if(CM.outcome==='Connected'){
      body += `<label style="display:flex;flex-direction:column;gap:6px;font-size:13px">Who answered<select class="inp" style="width:100%" data-cmf="who"><option>${esc(p.rep)} (${esc(p.rel)})</option><option>Backup contact</option><option>Other family member</option></select></label>`;
      body += `<div style="display:flex;flex-direction:column;gap:12px"><b style="font-size:14px">Ask, then tap what they said</b>${CM_Q.map(([k,q,opts])=>`<div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;color:#1F2937">${q}</span><div style="display:flex;flex-wrap:wrap;gap:6px">${opts.map(v=>cmChip(k,v,CM.ans[k])).join('')}</div></div>`).join('')}</div>`;
      body += `<label style="display:flex;flex-direction:column;gap:6px;font-size:13px">What they said, in their words<textarea class="inp" data-cmf="words" style="width:100%;min-height:64px;padding:8px 12px" placeholder="Write it the way they said it">${esc(CM.words)}</textarea></label>`;
      body += `<div style="display:flex;flex-direction:column;gap:8px;border-top:1px solid #EEF2F6;padding-top:12px"><b style="font-size:14px">Does anything need action?</b>${sug?`<div style="font-size:12px;color:#B54708">Suggested from their answers: ${esc(sug)}</div>`:''}<div style="display:flex;gap:6px">${cmChip('action','No',CM.action==='no'?'No':'')}${cmChip('action','Yes, log a grievance',CM.action==='yes'?'Yes, log a grievance':'')}</div></div>`;
      if(CM.action==='yes'){
        body += `<div style="background:#F8FAFC;border:1px solid #E3EAF2;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px">
          <label style="display:flex;flex-direction:column;gap:6px;font-size:13px">Category<select class="inp" style="width:100%" data-cmcat="1">${Object.keys(own).map(c=>`<option ${c===CM.cat?'selected':''}>${c}</option>`).join('')}</select></label>
          <div style="font-size:13px;display:grid;grid-template-columns:110px 1fr;gap:4px 10px"><span style="color:#667085">Goes to</span><b style="font-weight:600">${o?esc(o[0]):'Choose a category'}</b><span style="color:#667085">Due</span><span>${o?(o[1]==='now'?'Now. Chandraji is told immediately and an incident report number is needed to close.':'Within '+o[1]+'. Reminder at 3 hours.'):''}</span><span style="color:#667085">Logged as</span><span>G-0${CM.gid} · came in as Random call · family's words copied in</span></div>
          <label style="display:flex;flex-direction:column;gap:6px;font-size:13px">What needs fixing (short)<input class="inp" style="width:100%" data-cmf="concern" value="${esc(CM.concern)}" placeholder="e.g. wants to know what he ate and how he slept"></label>
          ${CM.cat==='Safety'?'<div style="background:#FEF3F2;border:1px solid #FDA29B;border-radius:10px;padding:8px 10px;font-size:12px;color:#B42318">Safety concern: Chandraji and the treating doctor are called now. The grievance cannot close without an incident report number.</div>':''}
        </div>`;
      }
      if(CM.ans.q1==='Very happy') body += `<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" data-cmcompl="1" ${CM.compl?'checked':''}>They praised someone. Log it as a compliment so the staff member hears about it.</label>`;
    }
  }
  const canSave = p && CM.outcome && (CM.outcome!=='Connected' || (CM.action && (CM.action==='no' || CM.cat)));
  el.innerHTML = `<div style="position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40;display:flex;justify-content:flex-end" data-cmclose="bg">
    <div role="dialog" aria-label="Log a family call" style="width:560px;max-width:100%;height:100%;overflow:auto;background:#fff;box-shadow:-10px 0 30px rgba(15,23,42,.15);display:flex;flex-direction:column">
      <div style="padding:18px 20px;border-bottom:1px solid #E3EAF2;display:flex;justify-content:space-between;gap:10px;align-items:flex-start">${head}<button type="button" data-cmclose="x" aria-label="Close" style="border:0;background:transparent;font-size:22px;color:#667085">×</button></div>
      ${p?`<div style="padding:12px 20px;border-bottom:1px solid #EEF2F6;display:flex;gap:8px;align-items:center"><button type="button" class="btn pri" style="height:36px">Call via HMS</button><span style="font-size:12px;color:#667085">Rings ${esc(p.rep)} from the hospital line. Time and length are logged on their own.</span></div>`:''}
      <div style="padding:16px 20px;display:flex;flex-direction:column;gap:16px;flex:1">${body||'<span style="color:#667085;font-size:13px">Pick the patient to start.</span>'}</div>
      <div style="padding:14px 20px;border-top:1px solid #E3EAF2;display:flex;justify-content:space-between;gap:8px;align-items:center"><span style="font-size:12px;color:#667085">Saved to the patient's call log${CM.action==='yes'?' and to Feedback':''}.</span><button type="button" data-cmsave="1" class="btn pri" ${canSave?'':'disabled style="opacity:.5;cursor:not-allowed"'}>${CM.action==='yes'&&CM.outcome==='Connected'?'Save call and log grievance':'Save call'}</button></div>
    </div></div>`;
}
function toast(msg){ let t=document.getElementById('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t);} t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#0F172A;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:90vw'; t.textContent=msg; clearTimeout(window.__tt); window.__tt=setTimeout(()=>t.remove(),4200); }
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-cm],[data-cmclose],[data-cmsave],[data-cmcompl]'); if(!t) return;
  if(t.dataset.cmclose){ if(t.dataset.cmclose==='bg' && e.target!==t) return; CM.open=false; drawCM(); return; }
  if(t.dataset.cmcompl){ CM.compl=t.checked; return; }
  if(t.dataset.cm){ const g=t.dataset.cm, v=t.dataset.val;
    if(g==='outcome') CM.outcome=v;
    else if(g==='action'){ CM.action = v==='No'?'no':'yes'; if(CM.action==='yes'&&!CM.cat) CM.cat=cmSuggest()||'Other'; }
    else { CM.ans[g]=v; if(CM.action!=='no'){ const s=cmSuggest(); if(s){ CM.action='yes'; CM.cat=s; } } }
    drawCM(); return; }
  if(t.dataset.cmsave && !t.disabled){
    const p=CM.p; const own=CM_OWN(p); const g = CM.outcome==='Connected'&&CM.action==='yes' ? { id:'G-0'+CM.gid, cat:CM.cat, owner:own[CM.cat][0], due:own[CM.cat][1], text: CM.concern || (CM.words?CM.words.slice(0,80):CM.cat), safety:CM.cat==='Safety' } : null;
    const res={ p, n:CM.n, outcome:CM.outcome, who:CM.who, ans:{...CM.ans}, words:CM.words, grievance:g, compliment:CM.compl };
    if(g) CM.gid++;
    CM.open=false; drawCM();
    if(window.onCallSaved) window.onCallSaved(res);
    toast(CM.outcome!=='Connected' ? `Attempt saved for ${p.name}. It will come back on Today tomorrow.` : g ? `Call saved. Grievance ${g.id} (${g.cat}) sent to ${g.owner}${g.due==='now'?', Chandraji told now':', due in '+g.due}.` : `Call saved for ${p.name}. No action needed.`);
  }
});
document.addEventListener('input',e=>{ const t=e.target; if(t.dataset.cmf) CM[t.dataset.cmf]=t.value; });
document.addEventListener('change',e=>{ const t=e.target;
  if(t.dataset.cmcat){ CM.cat=t.value; drawCM(); }
  if(t.dataset.cmpick){ const x=(window.CM_PATIENTS||[]).find(q=>q.id===t.value); if(x){ CM.p=x; CM.who=x.rep; CM.n=x.callN||1; drawCM(); } }
});

</script>
<script>
const LIVE_IMG = "";
const state = { done:{}, acted:{}, open:null, brief:true, view:'today', newG:0 };
function setState(p){ Object.assign(state,p); render(); }
    const menus = {
      'Safety': [['Call Chandraji and the treating doctor', 'Required today for Safety = Yes'], ['Add incident report number', 'Grievance cannot close without it'], ['Update the family', 'Call first, then write']],
      'Grievance': [['Update the family', 'Call and log what you said'], ['Mark resolved', 'Family confirms they are satisfied'], ['Escalate to Chandraji', 'GM Operations']],
      'Discharge': [['Start family meeting', '10 to 15 min: follow-up dates, call centre number'], ['Start feedback interview', 'Form v6, you ask and record'], ['Ask the clinician to fill dates', 'Doctor or psychologist follow-up date']],
      'Feedback': [['Escalate to Chandraji', 'Detractor (NPS 0 to 6), same day'], ['Call the family back', 'Logged in the HMS call log'], ['Log as a grievance', 'If something needs fixing']],
      'Admission': [['Mark family met', 'Rules, visiting hours, contact card, updates'], ['Take preferences', 'Diet, language, faith, routine, visitors'], ['Call the family', 'Logged in the HMS call log']],
      'Preferences': [['Take preferences now', 'Opens the preferences form'], ['Share with the ward', 'Nursing and kitchen see it'], ['Call the family', 'If the patient cannot say']],
      'Family call': [['Call and log', 'Opens the call script and notes'], ['Log a concern from the call', 'Becomes a grievance'], ['Reschedule', 'Family asked for another time']],
      'Team check': [['Remind the clinician', 'Sends a reminder in the HMS'], ['Call the family yourself', 'Logged in the HMS call log'], ['Raise with floor lead', 'If it keeps happening']],
      'Call list': [['Call now', 'Uses the follow-up call script'], ['Book OPD', 'Doctor or psychologist, online or in person'], ['Close with a reason', 'Went elsewhere, unaffordable, feeling better']],
      'Ward check': [['Start the check', 'Rights, costs, grievance officer, feedback box'], ['Log a missing notice', 'Goes to Admin Manager'], ['Mark done', 'For this month']],
      'Training': [['Mark attendance', 'Who came today'], ['Add a session', 'Topic, floor, date'], ['Send the slides', 'To nurses who missed it']]
    };
    const raw = [
      { id: 'nb', type: 'Safety', late: true, red: true, name: 'Neel Bose', initials: 'NB', sub: '23/M · Day 6 · Room 213 A', tags: ['Readmission'],
        items: [
          { id: 'nb1', c: 'red', text: 'Brother says a night attendant pushed Neel', meta: 'grievance G-0145 · Safety = Yes · needs Chandraji and an incident report number today' },
          { id: 'nb2', c: 'blue', text: 'Room too noisy at night', meta: 'G-0140 · 4 h 10 m left · Sister Rekha' }
        ], others: 'Sister Rekha: statement taken from the night attendant, 9:40 am' },

}
function trk(){

  ${TRK.map(r=>`<div style="grid-template-columns:200px 1fr 1.4fr 180px"><span style="font-weight:600">${esc(r.tab)}</span><span style="color:#475569">${esc(r.now)}</span><span class="hl">${esc(r.hms)}</span><span>${esc(r.who)}</span></div>`).join('')}</div></div>`;
}
function render(){
  document.getElementById('root').innerHTML = state.view==='today'?today():state.view==='cmp'?cmp():trk();
  document.querySelectorAll('.rev button').forEach(b=>b.classList.toggle('on',b.dataset.v===state.view));
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a'); if(!t) return;
  if(t.tagName==='A'&&t.getAttribute('href')==='#') e.preventDefault();
  if(t.dataset.v){setState({view:t.dataset.v,open:null});window.scrollTo(0,0);return;}
  if(t.dataset.call){ if(t.dataset.call==='pick') openCall(null); else { const pp=TP.find(x=>x.id===t.dataset.call); pp.item=t.dataset.item; pp.row=t.dataset.row; openCall(pp, pp.callN); } return; }
  if(t.dataset.done){setState({done:{...state.done,[t.dataset.done]:true}});return;}
  if(t.dataset.open){setState({open:state.open===t.dataset.open?null:t.dataset.open});return;}
  if(t.dataset.act){setState({open:null,acted:{...state.acted,[t.dataset.act]:t.dataset.m}});return;}
  if(t.dataset.hide){setState({brief:false});return;}
  if(t.hasAttribute("data-eye")){setState({eye:t.dataset.eye||null,open:null});return;}
  if(state.open&&!t.closest('.menu')) setState({open:null});
});

/* TDX-CAL: who is on today, cover needed, and what the Rounds sent (reads the Calendar and Rounds pages' data, same browser) */
(function(){
  const __t=today;
  const hh=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
  function strips(){
    let h='';
    try{
      const C=window.PXCal;if(C){
        C.reload();const t=C.todayISO();const on=C.onToday(t);
        const w=on.filter(x=>x.code==='M'||x.code==='E').map(x=>esc(x.name)+' <span style="color:#667085">('+(x.code==='M'?'morning':'evening')+', '+esc(x.floor)+')</span>').join(' · ');
        const lv=on.filter(x=>x.code==='L').map(x=>esc(x.name)+' ('+esc(x.leave.type.toLowerCase())+(x.leave.cover?', cover '+esc(C.nameOf(x.leave.cover)):'')+')');
        const off=on.filter(x=>x.code==='O').map(x=>esc(x.name));
        h+='<div style="background:#fff;border:1px solid #E3EAF2;border-radius:12px;padding:10px 16px;font-size:14px;display:flex;flex-direction:column;gap:3px"><div><b>Who is on today</b> <span style="color:#667085">· '+esc(C.label(t))+'</span></div><div>'+(w||'No one is on shift.')+'</div>'+(lv.length?'<div style="color:#93370D"><b>On leave:</b> '+lv.join(', ')+'</div>':'')+(off.length?'<div style="color:#667085">Off: '+off.join(', ')+'</div>':'')+'</div>';
        const cl=C.clashes(t,C.addDays(t,7)).slice(0,3);
        cl.forEach(c=>{const cv=c.cover.map(C.nameOf);h+='<div style="background:#FEF3F2;border:1px solid #FDA29B;border-radius:12px;padding:10px 16px;font-size:14px"><b style="color:#B42318">'+esc(C.summary(c))+'.</b> '+(cv.length?esc(cv[0])+' is on shift. Open the Calendar and give them these.':'No one else is on shift then.')+'</div>';});
      }
    }catch(e){}
    try{
      const R=JSON.parse(localStorage.getItem('px_rounds_v1')||'null');
      if(R){
        const saf=(R.saf||[]).filter(a=>!a.ack);const reqs=(R.ent||[]).filter(e=>e.kind==='request'&&!e.cl);const notes=(R.ent||[]).filter(e=>e.kind==='note');const gr=(R.ent||[]).filter(e=>e.kind==='grievance');const iss=(R.iss||[]).filter(i=>i.st==='open');
        if(saf.length)h+='<div style="background:#FEF3F2;border:1px solid #FDA29B;border-radius:12px;padding:10px 16px;font-size:14px"><b style="color:#B42318">'+saf.length+' safety concern'+(saf.length>1?'s':'')+' from Rounds, not taken yet.</b> '+saf.map(a=>esc((a.patient||'Room '+a.room)+': '+a.what)).join(' · ')+'</div>';
        if(reqs.length||notes.length||gr.length||iss.length)h+='<div style="background:#fff;border:1px solid #E3EAF2;border-radius:12px;padding:10px 16px;font-size:14px;display:flex;flex-direction:column;gap:3px"><div><b>From Rounds</b> <span style="color:#667085">· what was sent on the walk today</span></div>'
          +(gr.length?'<div>'+gr.length+' grievance'+(gr.length>1?'s':'')+' logged with source Rounds: '+gr.slice(0,3).map(g=>esc(g.id+' '+g.patient)).join(', ')+'</div>':'')
          +(reqs.length?'<div>'+reqs.length+' request'+(reqs.length>1?'s':'')+' for you: '+reqs.slice(0,4).map(r=>esc(r.patient+' · '+r.title)).join(' · ')+'</div>':'')
          +(notes.length?'<div>'+notes.length+' note'+(notes.length>1?'s':'')+' sent to the nursing in-charge (sleep).</div>':'')
          +(iss.length?'<div>'+iss.length+' room issue'+(iss.length>1?'s':'')+' open with the fixing teams: '+iss.slice(0,3).map(i=>esc('Room '+i.room+' '+i.what)).join(', ')+'</div>':'')+'</div>';
      }
    }catch(e){}
    return h;}
  today=function(){const out=__t.apply(this,arguments);return out.replace('<div class="chips">',strips()+'<div class="chips">');};
  window.addEventListener('storage',()=>{try{render();}catch(e){}});
})();

render();
</script>
