  </div>

function render(){document.getElementById('root').innerHTML=S.view==='cmp'?cmp():shell(main());drawer();document.querySelectorAll('.rev button').forEach(b=>{if(b.dataset.v!=='phone')b.classList.toggle('on',b.dataset.v===S.view)});}
function save(i){const r=rooms()[i];const R=S.r;let g=0,sg=0;

 r.pts.forEach(p=>{const ab=R['a:'+p.n];const sp=R['s:'+p.n];const T=AB.find(x=>x[0]===ab);if(ab&&ab!=='Sleep'&&ab!=='Activities'){g++;if(T&&T[4]&&T[4].includes(sp))sg++;}if(R['p:'+p.n]&&R['p:'+p.n]!=='Not available')p.last=0;});
 r.st=items.length?'issue':'done';

<script>
/* Random family call pop-up, shared by Today and Patients */
const CM = { open:false, p:null, outcome:null, ans:{}, action:null, cat:null, safety:false, compl:false, words:'', concern:'', who:null, n:1, gid:147, kind:null, src:null };
const CM_Q = [
  ['q1','How do you feel he/she is being looked after?',['Very happy','Happy','Okay','Not happy']],
  ['q2','Do the 8 pm updates tell you what you want to know?',['Yes, useful','Too general, want more detail','Not every day','Not getting them']],
  ['q3','Has the doctor spoken to you this week?',['Yes','No','Only the psychologist']],
  ['q4','Do you understand how treatment is going and when to expect change?',['Yes','Not sure','No change seen, worried']],
  ['q5','Has the psychologist changed, or were sessions missed (weekends, leave)?',['No','Yes']],
  ['q6','Anything about food, room, cleanliness or billing?',['Nothing','Food','Room or cleanliness','Billing']],
  ['q7','Any worry about how staff treat him/her, or anything that happened (fall, injury, force)?',['No concern','Yes, a concern']]
];
const CM_OWN = p => ({
  'Family updates':['Psychology team lead','6 h'],
  'Doctor communication':[p.dr||'Treating psychiatrist','6 h'],
  'Treatment progress':[(p.dr||'Treating psychiatrist')+' (family meeting)','6 h'],
  'Therapist continuity':['Psychology team lead','6 h'],
  'Billing and insurance':['Billing desk','6 h'],
  'Food and dietary':['Kitchen supervisor','6 h'],
  'Room and housekeeping':['Housekeeping supervisor','6 h'],
  'Rights':['Kanika and Chandraji','6 h'],
  'Safety':['Chandraji and treating doctor','now'],
  'Other':['Kanika','6 h']
});
function cmSuggest(){
  const a=CM.ans;
  if(a.q7==='Yes, a concern') return 'Safety';
  if(a.q2&&a.q2!=='Yes, useful') return 'Family updates';
  if(a.q3==='No'||a.q3==='Only the psychologist') return 'Doctor communication';
  if(a.q4==='No change seen, worried') return 'Treatment progress';
  if(a.q5==='Yes') return 'Therapist continuity';
  if(a.q6==='Billing') return 'Billing and insurance';
  if(a.q6==='Food') return 'Food and dietary';
  if(a.q6==='Room or cleanliness') return 'Room and housekeeping';
  if(a.q1==='Not happy') return 'Other';
  return null;
}

function openCall(p, n, kind){ Object.assign(CM,{open:true,kind:kind||(p?'call':null),src:null,p:p||null,outcome:null,ans:{},action:null,cat:null,safety:false,compl:false,words:'',concern:'',who:p?p.rep:null,n:n||1}); drawCM(); }
function cmChip(group,val,cur){ const on=cur===val; return `<button type="button" data-cm="${group}" data-val="${esc(val)}" style="height:32px;padding:0 12px;border-radius:999px;border:1px solid ${on?'#1E6CDB':'#D6DEE8'};background:${on?'#E8F1FE':'#fff'};color:${on?'#1E5BB8':'#344054'};font-size:13px;font-weight:600">${esc(val)}</button>`; }
function drawCM(){
  const el=document.getElementById('cm'); if(!el) return;
  if(!CM.open){ el.innerHTML=''; return; }
  const p=CM.p; const pats=(window.CM_PATIENTS||[]);
  const sug=cmSuggest(); if(CM.action===null && sug){ CM.action='yes'; CM.cat=sug; CM.safety=sug==='Safety'; }
  const own=p?CM_OWN(p):{}; const o=CM.cat?own[CM.cat]:null;
  const head = p ? `<div><div style="font-size:12px;font-weight:700;letter-spacing:.05em;color:#1D4ED8">${CM.kind==='concern'?'CONCERN':'RANDOM FAMILY CALL '+CM.n+' OF 2'}</div><b style="font-size:18px">${esc(p.name)}</b><div style="font-size:13px;color:#667085">${esc(p.rep)} (${esc(p.rel)}) · ${esc(p.ph||'')} · Day ${p.day} · Room ${esc(p.room)}</div></div>`
    : `<div><div style="font-size:12px;font-weight:700;letter-spacing:.05em;color:#1D4ED8">LOG A CALL OR CONCERN</div><label style="display:flex;flex-direction:column;gap:6px;font-size:13px;margin-top:6px">Patient<select data-cmpick="1" class="inp" style="width:320px"><option value="">Choose a patient</option>${pats.map(x=>`<option value="${x.id}">${esc(x.name)} · Room ${esc(x.room)}</option>`).join('')}</select></label></div>`;
  let body='';
  if(!CM.kind) body += `<div style="display:flex;flex-direction:column;gap:8px"><b style="font-size:14px">What are you logging?</b><div style="display:flex;flex-wrap:wrap;gap:6px">${cmChip('kind','Random family call','')}${cmChip('kind','Someone raised a concern','')}</div><span style="font-size:12px;color:#667085">A concern can come from the family, the patient, a ward meeting, the front desk or at discharge.</span></div>`;
  if(p && CM.kind==='concern'){
    const srcs=['Family called in','Patient told me','Ward meeting','Front desk','At discharge'];
    body += `<div style="display:flex;flex-direction:column;gap:8px"><b style="font-size:14px">How did it come in?</b><div style="display:flex;flex-wrap:wrap;gap:6px">${srcs.map(v=>cmChip('src',v,CM.src)).join('')}</div></div>`;
    body += `<label style="display:flex;flex-direction:column;gap:6px;font-size:13px">What they said, in their words<textarea class="inp" data-cmf="words" style="width:100%;min-height:72px;padding:8px 12px" placeholder="Write it the way they said it">${esc(CM.words)}</textarea></label>`;
    body += `<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" data-cmcompl="1" ${CM.compl?'checked':''}>It's praise, not a complaint. Log it as a compliment.</label>`;
    if(!CM.compl){ body += `<div style="background:#F8FAFC;border:1px solid #E3EAF2;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px"><label style="display:flex;flex-direction:column;gap:6px;font-size:13px">What is it about<select class="inp" style="width:100%" data-cmcat="1">${Object.keys(own).map(c=>`<option ${c===CM.cat?'selected':''}>${c}</option>`).join('')}</select></label><div style="font-size:13px;display:grid;grid-template-columns:110px 1fr;gap:4px 10px"><span style="color:#667085">Goes to</span><b style="font-weight:600">${o?esc(o[0]):''}</b><span style="color:#667085">Due</span><span>${o?(o[1]==='now'?'Now. Chandraji is called immediately.':'Within '+o[1]+'. Reminder at 3 hours, Chandraji at 6.'):''}</span></div>${CM.cat==='Safety'?'<div style="background:#FEF3F2;border:1px solid #FDA29B;border-radius:10px;padding:8px 10px;font-size:12px;color:#B42318">Safety: Chandraji and the treating doctor are called now. It cannot close without an incident report number.</div>':''}</div>`; }
  }
  if(p && CM.kind==='call'){
    body += `<div style="display:flex;flex-direction:column;gap:8px"><b style="font-size:14px">Did they pick up?</b><div style="display:flex;flex-wrap:wrap;gap:6px">${['Connected','No answer','Asked to call later'].map(v=>cmChip('outcome',v,CM.outcome)).join('')}</div></div>`;
    if(CM.outcome && CM.outcome!=='Connected') body += `<div style="background:#F8FAFC;border-radius:10px;padding:10px 12px;font-size:13px;color:#475467">Saved as attempt ${CM.outcome==='No answer'?'1 · no answer':'1 · asked to call later'}. It comes back on Today tomorrow at the same time. After 2 missed attempts, the backup contact is suggested.</div>`;
    if(CM.outcome==='Connected'){
      body += `<label style="display:flex;flex-direction:column;gap:6px;font-size:13px">Who answered<select class="inp" style="width:100%" data-cmf="who"><option>${esc(p.rep)} (${esc(p.rel)})</option><option>Backup contact</option><option>Other family member</option></select></label>`;
      body += `<div style="display:flex;flex-direction:column;gap:12px"><b style="font-size:14px">Ask, then tap what they said</b>${CM_Q.map(([k,q,opts])=>`<div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;color:#1F2937">${q}</span><div style="display:flex;flex-wrap:wrap;gap:6px">${opts.map(v=>cmChip(k,v,CM.ans[k])).join('')}</div></div>`).join('')}</div>`;
      body += `<label style="display:flex;flex-direction:column;gap:6px;font-size:13px">What they said, in their words<textarea class="inp" data-cmf="words" style="width:100%;min-height:64px;padding:8px 12px" placeholder="Write it the way they said it">${esc(CM.words)}</textarea></label>`;
      body += `<div style="display:flex;flex-direction:column;gap:8px;border-top:1px solid #EEF2F6;padding-top:12px"><b style="font-size:14px">Does anything need action?</b>${sug?`<div style="font-size:12px;color:#B54708">Suggested from their answers: ${esc(sug)}</div>`:''}<div style="display:flex;gap:6px">${cmChip('action','No',CM.action==='no'?'No':'')}${cmChip('action','Yes, log a grievance',CM.action==='yes'?'Yes, log a grievance':'')}</div></div>`;
      if(CM.action==='yes'){
        body += `<div style="background:#F8FAFC;border:1px solid #E3EAF2;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px">
          <label style="display:flex;flex-direction:column;gap:6px;font-size:13px">Category<select class="inp" style="width:100%" data-cmcat="1">${Object.keys(own).map(c=>`<option ${c===CM.cat?'selected':''}>${c}</option>`).join('')}</select></label>
          <div style="font-size:13px;display:grid;grid-template-columns:110px 1fr;gap:4px 10px"><span style="color:#667085">Goes to</span><b style="font-weight:600">${o?esc(o[0]):'Choose a category'}</b><span style="color:#667085">Due</span><span>${o?(o[1]==='now'?'Now. Chandraji is told immediately and an incident report number is needed to close.':'Within '+o[1]+'. Reminder at 3 hours.'):''}</span><span style="color:#667085">Logged as</span><span>G-0${CM.gid} · came in as Random call · family's words copied in</span></div>
          <label style="display:flex;flex-direction:column;gap:6px;font-size:13px">What needs fixing (short)<input class="inp" style="width:100%" data-cmf="concern" value="${esc(CM.concern)}" placeholder="e.g. wants to know what he ate and how he slept"></label>
          ${CM.cat==='Safety'?'<div style="background:#FEF3F2;border:1px solid #FDA29B;border-radius:10px;padding:8px 10px;font-size:12px;color:#B42318">Safety concern: Chandraji and the treating doctor are called now. The grievance cannot close without an incident report number.</div>':''}
        </div>`;
      }
      if(CM.ans.q1==='Very happy') body += `<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" data-cmcompl="1" ${CM.compl?'checked':''}>They praised someone. Log it as a compliment so the staff member hears about it.</label>`;
    }
  }
  const canSave = CM.kind==='concern' ? (p && CM.src && (CM.compl || CM.cat)) : p && CM.outcome && (CM.outcome!=='Connected' || (CM.action && (CM.action==='no' || CM.cat)));
  el.innerHTML = `<div style="position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40;display:flex;justify-content:flex-end" data-cmclose="bg">
    <div role="dialog" aria-label="Log a family call" style="width:560px;max-width:100%;height:100%;overflow:auto;background:#fff;box-shadow:-10px 0 30px rgba(15,23,42,.15);display:flex;flex-direction:column">
      <div style="padding:18px 20px;border-bottom:1px solid #E3EAF2;display:flex;justify-content:space-between;gap:10px;align-items:flex-start">${head}<button type="button" data-cmclose="x" aria-label="Close" style="border:0;background:transparent;font-size:22px;color:#667085">×</button></div>
      ${p&&CM.kind==='call'?`<div style="padding:12px 20px;border-bottom:1px solid #EEF2F6;display:flex;gap:8px;align-items:center"><button type="button" class="btn pri" style="height:36px">Call via HMS</button><span style="font-size:12px;color:#667085">Rings ${esc(p.rep)} from the hospital line. Time and length are logged on their own.</span></div>`:''}
      <div style="padding:16px 20px;display:flex;flex-direction:column;gap:16px;flex:1">${body}${CM.kind&&!p?'<span style="color:#667085;font-size:13px">Pick the patient above to start.</span>':''}</div>
      <div style="padding:14px 20px;border-top:1px solid #E3EAF2;display:flex;justify-content:space-between;gap:8px;align-items:center"><span style="font-size:12px;color:#667085">${CM.kind==='concern'?(CM.compl?'Saved to the patient record and Reports.':'Saved to the patient record and Grievances.'):'Saved to the patient record'+(CM.action==='yes'&&CM.outcome==='Connected'?' and Grievances':'')+'.'}</span><button type="button" data-cmsave="1" class="btn pri" ${canSave?'':'disabled style="opacity:.5;cursor:not-allowed"'}>${CM.kind==='concern'?(CM.compl?'Log compliment':'Log concern'):CM.action==='yes'&&CM.outcome==='Connected'?'Save call and log grievance':'Save call'}</button></div>
    </div></div>`;
}
function toast(msg){ let t=document.getElementById('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t);} t.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#0F172A;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:90vw'; t.textContent=msg; clearTimeout(window.__tt); window.__tt=setTimeout(()=>t.remove(),4200); }
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-cm],[data-cmclose],[data-cmsave],[data-cmcompl]'); if(!t) return;
  if(t.dataset.cmclose){ if(t.dataset.cmclose==='bg' && e.target!==t) return; CM.open=false; drawCM(); return; }
  if(t.dataset.cmcompl){ CM.compl=t.checked; if(CM.kind==='concern') drawCM(); return; }
  if(t.dataset.cm){ const g=t.dataset.cm, v=t.dataset.val;
    if(g==='kind'){ CM.kind = v==='Random family call'?'call':'concern'; if(CM.kind==='concern'&&!CM.cat) CM.cat='Other'; }
    else if(g==='src') CM.src=v;
    else if(g==='outcome') CM.outcome=v;
    else if(g==='action'){ CM.action = v==='No'?'no':'yes'; if(CM.action==='yes'&&!CM.cat) CM.cat=cmSuggest()||'Other'; }
    else { CM.ans[g]=v; if(CM.action!=='no'){ const s=cmSuggest(); if(s){ CM.action='yes'; CM.cat=s; } } }
    drawCM(); return; }
  if(t.dataset.cmsave && !t.disabled && CM.kind==='concern'){
    const p=CM.p; const own=CM_OWN(p);
    const g = CM.compl ? null : { id:'G-0'+CM.gid, cat:CM.cat, owner:own[CM.cat][0], due:own[CM.cat][1], text: CM.words?CM.words.slice(0,80):CM.cat, safety:CM.cat==='Safety' };
    const res={ p, kind:'concern', n:CM.n, outcome:'Concern', src:CM.src, who:CM.who, ans:{}, words:CM.words, grievance:g, compliment:CM.compl };
    if(g) CM.gid++;
    CM.open=false; drawCM();
    if(window.onCallSaved) window.onCallSaved(res);
    toast(g ? `Concern ${g.id} (${g.cat}) sent to ${g.owner}${g.due==='now'?', Chandraji called now':', due in '+g.due}. Added to ${p.name}'s record.` : `Compliment saved to ${p.name}'s record and Reports.`);
    return;
  }
  if(t.dataset.cmsave && !t.disabled){
    const p=CM.p; const own=CM_OWN(p); const g = CM.outcome==='Connected'&&CM.action==='yes' ? { id:'G-0'+CM.gid, cat:CM.cat, owner:own[CM.cat][0], due:own[CM.cat][1], text: CM.concern || (CM.words?CM.words.slice(0,80):CM.cat), safety:CM.cat==='Safety' } : null;
    const res={ p, n:CM.n, outcome:CM.outcome, who:CM.who, ans:{...CM.ans}, words:CM.words, grievance:g, compliment:CM.compl };
    if(g) CM.gid++;
    CM.open=false; drawCM();
    if(window.onCallSaved) window.onCallSaved(res);
    toast(CM.outcome!=='Connected' ? `Attempt saved for ${p.name}. It will come back on Today tomorrow.` : g ? `Call saved. Grievance ${g.id} (${g.cat}) sent to ${g.owner}${g.due==='now'?', Chandraji told now':', due in '+g.due}.` : `Call saved for ${p.name}. No action needed.`);
  }
});
document.addEventListener('input',e=>{ const t=e.target; if(t.dataset.cmf) CM[t.dataset.cmf]=t.value; });
document.addEventListener('change',e=>{ const t=e.target;
  if(t.dataset.cmcat){ CM.cat=t.value; drawCM(); }
  if(t.dataset.cmpick){ const x=(window.CM_PATIENTS||[]).find(q=>q.id===t.value); if(x){ CM.p=x; CM.who=x.rep; CM.n=x.callN||1; drawCM(); } }
});

</script>
<script>
/* Rounds, working version (13 Nov build). Adds to the team's prototype: it remembers the day, keeps clocks, sends the right things to the right owner,
   repeats safety alerts every 30 minutes, queues when offline, lets the lists be edited, and shows entries per patient (read only).
   State is in localStorage 'px_rounds_v1' so the Today and Grievances pages (same origin) can read it. Demo data only; nothing leaves the browser. */
(function(){
  const KEY='px_rounds_v1', LKEY='px_rounds_lists_v1';
  const H=3600000, M=60000;
  const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
  const hhmm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
  const left=(t0,lim)=>{const ms=t0+lim-Date.now();if(ms<=0)return 'Overdue '+Math.floor(-ms/H)+' h '+Math.floor((-ms%H)/M)+' m';return Math.floor(ms/H)+' h '+Math.floor((ms%H)/M)+' m left';};
  let ST=null;
  function fresh(){return {day:dayKey(),rooms:{},iss:null,ent:[],log:[],queue:[],saf:[]};}
  function load(){try{ST=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){ST=null;}
    if(!ST||typeof ST!=='object')ST=fresh();
    if(ST.day!==dayKey()){/* a new day: room boxes start empty again, open items stay */const keep=ST;ST=fresh();ST.iss=(keep.iss||[]).filter(i=>i.st==='open');ST.ent=keep.ent||[];ST.log=keep.log||[];ST.saf=(keep.saf||[]).filter(a=>!a.ack);}
    ST.rooms=ST.rooms||{};ST.ent=ST.ent||[];ST.log=ST.log||[];ST.queue=ST.queue||[];ST.saf=ST.saf||[];}
  function store(){try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){}}
  /* ---- lists that can be edited in Setting ---- */
  function lists(){return {RG:RG.map(g=>[g[0],g[1].map(x=>x.slice())]),CG:CG.map(g=>[g[0],g[1].map(x=>x.slice())]),AB:AB.map(x=>x.map(y=>Array.isArray(y)?y.slice():y))};}
  function applyLists(L){
    if(L.RG){RG.length=0;L.RG.forEach(g=>RG.push(g));}
    if(L.CG){CG.length=0;L.CG.forEach(g=>CG.push(g));}
    if(L.AB){AB.length=0;L.AB.forEach(g=>AB.push(g));ABOUT.length=0;AB.forEach(x=>ABOUT.push([x[0],x[1]]));}
    SAFE.length=0;(RG[0]?RG[0][1]:[]).forEach(x=>SAFE.push(x));
    TODAY.length=0;[...RG,...CG].forEach(g=>g[1].forEach(x=>TODAY.push(x)));}
  try{const L=JSON.parse(localStorage.getItem(LKEY)||'null');if(L&&L.RG&&L.CG&&L.AB)applyLists(L);}catch(e){}
  /* today's rotation: one section a day, six days */
  try{window.DAY_ROT=Math.floor(Date.now()/86400000)%6;}catch(e){}
  load();
  /* seed: the one open issue from the prototype gets a real start time; restore room boxes */
  if(!ST.iss){ST.iss=[{room:'206',what:'Exhaust fan not working',team:'Maintenance (electrical)',st:'open',t0:Date.now()-110*M,lim:4*H,by:'Prabh',id:'RI-001'}];store();}
  function sync(){
    Object.keys(FLOORS).forEach(f=>FLOORS[f].forEach(r=>{const k=f+'|'+r.room;if(ST.rooms[k])r.st=ST.rooms[k];}));
    ISS.length=0;ST.iss.forEach(i=>ISS.push(i));ISS.forEach(i=>{i.due=i.safety?('Chandraji told '+hhmm(i.t0)):left(i.t0,i.lim||4*H);});}
  sync();
  /* ---- entries: grievance / note / request / alert, per patient (read only elsewhere) ---- */
  function nextId(p){S.seq=(S.seq||150)+1;return p+'-'+String(S.seq).padStart(4,'0');}
  function addEntry(e){e.t0=Date.now();e.by='Prabh';e.src='Rounds';e.queued=!navigator.onLine;ST.ent.unshift(e);
    ST.log.unshift({t:e.t0,patient:e.patient,room:e.room,kind:e.kind,text:e.title,src:'Rounds',id:e.id});
    if(e.safety){ST.saf.unshift({id:e.id,patient:e.patient,room:e.room,what:e.title,t0:e.t0,last:e.t0,n:1,ack:false});}
    if(e.queued)ST.queue.push(e.id);}
  const origSave=save;
  save=function(i){
    const r=rooms()[i],R=S.r,fl=S.fl;
    /* work out what this room produced before the prototype resets S.r */
    const items=Object.keys(R).filter(k=>k.startsWith('i:')&&R[k]).map(k=>k.slice(2));
    const out=[];
    r.pts.forEach(p=>{const ans=R['p:'+p.n];if(!ans)return;
      if(ans==='Not available'){out.push({kind:'log',patient:p.n,room:r.room,title:'Not available this round (asleep, in a session or not up to it). Comes up again next round.'});return;}
      if(ans==='All good'){out.push({kind:'log',patient:p.n,room:r.room,title:'Spoken to on the round: all good'});return;}
      const topic=R['a:'+p.n],sp=R['s:'+p.n]||'',words=R['w:'+p.n]||'';const T=AB.find(x=>x[0]===topic);if(!T)return;
      const safe=!!(T[4]&&T[4].includes(sp)),leaving=sp==='Wants to leave now';
      const owner=safe?'Chandraji and the treating doctor':sp==='Billing question'?'Billing desk':sp==='Wants to make a formal complaint'?'Kanika and Chandraji':leaving?'Treating psychiatrist and Chandraji':T[1];
      const title=topic+(sp?': '+sp:'')+(words?' · "'+words+'"':'');
      if(topic==='Sleep')out.push({kind:'note',id:nextId('N'),patient:p.n,room:r.room,title,owner:'Nursing in-charge',cat:T[2]});
      else if(topic==='Activities')out.push({kind:'request',id:nextId('Q'),patient:p.n,room:r.room,title,owner:'Patient experience (you)',cat:T[2]});
      else out.push({kind:'grievance',id:nextId('G'),patient:p.n,room:r.room,title,owner,cat:safe?'Safety':T[2],safety:safe||leaving,lim:safe||leaving?0:6*H,topic,sp});
    });
    /* records gaps picked up from the HMS and sent on */
    r.pts.forEach(p=>{if(p.rec)out.push({kind:'log',patient:p.n,room:r.room,title:p.rec+' · sent to '+(/Vitals/.test(p.rec)?'nursing in-charge':'psychology team lead')});});
    const nIss=items.length,bad=R.room==='bad';
    const roomLabel=r.common?'Common areas':'Room '+r.room;
    const mine=[];
    items.forEach(n=>{const x=TODAY.find(y=>y[0]===n);if(!x)return;mine.push({id:nextId('RI'),room:r.room,what:n,team:x[1],st:'open',t0:Date.now(),lim:4*H,by:'Prabh',safety:!!x[2],fl});});
    /* photo name, if one was added */
    if(R.photo)mine.forEach(m=>m.photo=R.photo);
    out.forEach(e=>{if(e.kind!=='log')addEntry(Object.assign({floor:fl},e));else{ST.log.unshift({t:Date.now(),patient:e.patient,room:e.room,kind:'log',text:e.title,src:'Rounds'});}});
    mine.forEach(m=>{ST.iss.unshift(m);ST.log.unshift({t:m.t0,patient:'',room:r.room,kind:'room',text:m.what+' · sent to '+m.team,src:'Rounds',id:m.id});if(m.safety)ST.saf.unshift({id:m.id,patient:'',room:r.room,what:m.what,t0:m.t0,last:m.t0,n:1,ack:false});});
    ST.log.unshift({t:Date.now(),patient:'',room:r.room,kind:'round',text:roomLabel+(bad?' · '+nIss+' issue'+(nIss>1?'s':'')+' sent':' · fine'),src:'Rounds'});
    ST.rooms[fl+'|'+r.room]=nIss?'issue':'done';
    /* count for the toast the way the prototype does it */
    const g=out.filter(e=>e.kind==='grievance').length,sg=out.filter(e=>e.kind==='grievance'&&e.safety).length,nt=out.filter(e=>e.kind==='note').length,rq=out.filter(e=>e.kind==='request').length;
    const msg=[roomLabel+' saved.'];if(nIss)msg.push(nIss+' issue'+(nIss>1?'s':'')+' sent.');if(g)msg.push(g+' grievance'+(g>1?'s':'')+' logged'+(sg?' ('+sg+' safety, Chandraji told)':'')+'.');if(nt)msg.push(nt+' note to the nursing in-charge.');if(rq)msg.push(rq+' request on your Today list.');
    if(!navigator.onLine)msg.push('No signal: kept on this device, sends when you are back online.');
    r.pts.forEach(p=>{const a=R['p:'+p.n];if(a&&a!=='Not available')p.last=0;});
    r.st=ST.rooms[fl+'|'+r.room];
    ST.iss.forEach(i=>{if(!i.due)i.due='';});
    store();sync();toast(msg.join(' '));
  };
  /* ---- render wrapper: clocks, safety banner, flags ---- */
  const origMain=main;
  function banners(){
    const open=ST.saf.filter(a=>!a.ack);
    let h='';
    if(open.length){h+=`<div role="alert" style="background:#FEF3F2;border:1px solid #FDA29B;border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:8px"><b style="color:#B42318">${open.length} safety concern${open.length>1?'s':''} open: Chandraji and the treating doctor are told, and told again every 30 minutes until someone takes it.</b>${open.map(a=>`<div style="display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;font-size:14px"><span style="flex:1;min-width:200px"><b>${a.patient?esc(a.patient)+' · ':''}Room ${esc(a.room)}</b>: ${esc(a.what)}</span><span style="color:#B42318;font-weight:600">told ${a.n} time${a.n>1?'s':''}, last ${hhmm(a.last)}</span><button class="btn" data-ack="${esc(a.id)}">Chandraji has taken it</button></div>`).join('')}</div>`;}
    const q=ST.queue.length;
    if(q||!navigator.onLine)h+=`<div style="background:#FFF4D6;border:1px solid #F79009;border-radius:12px;padding:10px 16px;font-size:14px;color:#93370D"><b>${navigator.onLine?q+' saved on this device, sending now':'No signal.'}</b> ${navigator.onLine?'':'Keep going: every room is kept on this device and is sent when the signal is back ('+q+' waiting).'}</div>`;
    return h;}
  main=function(){
    ST.iss.forEach(i=>{i.due=i.safety?('Chandraji told '+hhmm(i.t0)):left(i.t0,i.lim||4*H);});
    let h=origMain();
    /* put banners above the floor chips and the buttons for lists and patient entries in the bar */
    h=h.replace('<main>','<main>'+banners());
    h=h.replace('</main>',`<div style="display:flex;flex-wrap:wrap;gap:8px"><button class="btn" data-px="entries">What was logged today</button><button class="btn" data-px="people">Entries by patient</button><button class="btn" data-px="lists">Edit the checklists (Setting)</button></div></main>`);
    return h;};
  /* ---- extra pop-ups ---- */
  function modal(title,body,wide){const el=document.getElementById('cm');el.innerHTML=`<div data-pxclose="1" style="position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto"><div role="dialog" aria-label="${esc(title)}" style="background:#fff;border-radius:16px;width:${wide?'860':'640'}px;max-width:100%;display:flex;flex-direction:column"><div style="padding:14px 20px;border-bottom:1px solid #E3EAF2;display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px">${esc(title)}</b><button data-pxclose="x" aria-label="Close" style="border:0;background:transparent;font-size:22px;color:#667085">×</button></div><div style="padding:16px 20px;display:flex;flex-direction:column;gap:12px">${body}</div></div></div>`;}
  const kindName={grievance:'Grievance',note:'Note to nursing',request:'Request for you',room:'Room issue',round:'Round',log:'Round note'};
  function entriesHtml(){
    const a=ST.ent.slice(0,40);
    if(!a.length&&!ST.iss.length)return '<span style="color:#667085">Nothing logged yet today. Walk a room and save it.</span>';
    return `<div style="display:flex;flex-direction:column;gap:6px">${a.map(e=>`<div style="border:1px solid #E3EAF2;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(e.id)} · ${esc(kindName[e.kind]||e.kind)}${e.safety?' · <span style="color:#B42318">SAFETY</span>':''}</b><span style="font-size:12px;color:#667085">${hhmm(e.t0)} · source Rounds${e.queued?' · waiting for signal':''}</span></div><span style="font-size:14px">${esc(e.patient)} · Room ${esc(e.room)} · ${esc(e.title)}</span><span style="font-size:13px;color:#475467">To ${esc(e.owner||'')}${e.kind==='grievance'?(e.safety?' · told now':' · clock '+left(e.t0,e.lim||6*H)+(Date.now()-e.t0>=3*H?' · reminder sent to owner':'')+(Date.now()-e.t0>=6*H?' · S Chandra told':'')):''}</span></div>`).join('')}</div>`;}
  function peopleHtml(){
    const by={};ST.log.forEach(l=>{if(l.patient){(by[l.patient]=by[l.patient]||[]).push(l);}});
    const names=Object.keys(by).sort();
    if(!names.length)return '<span style="color:#667085">No patient entries yet. They appear here once a room is saved, and the same list shows in the patient\'s record (read only).</span>';
    return `<span style="font-size:13px;color:#667085">Read only. This is what the patient record shows under Rounds.</span>${names.map(n=>`<div style="border:1px solid #E3EAF2;border-radius:12px;padding:10px 12px"><b>${esc(n)}</b>${by[n].slice(0,8).map(l=>`<div style="font-size:13px;color:#344054;padding-top:4px">${hhmm(l.t)} · Room ${esc(l.room)} · ${esc(l.text)}</div>`).join('')}</div>`).join('')}`;}
  const tx=(id,v,h)=>`<textarea id="${id}" class="inp" spellcheck="false" style="width:100%;min-height:${h}px;padding:8px 12px;font-family:ui-monospace,Consolas,monospace;font-size:12px">${esc(v)}</textarea>`;
  function listsHtml(){
    const L=lists();
    const rg=L.RG.map(g=>'## '+g[0]+'\n'+g[1].map(x=>x[0]+' | '+x[1]+(x[2]?' | safety':'')).join('\n')).join('\n\n');
    const cg=L.CG.map(g=>'## '+g[0]+'\n'+g[1].map(x=>x[0]+' | '+x[1]+(x[2]?' | safety':'')).join('\n')).join('\n\n');
    const ab=L.AB.map(x=>x[0]+' | '+x[1]+' | '+x[2]+' | '+x[3].join('; ')+(x[4]?' | safety: '+x[4].join('; '):'')).join('\n');
    return `<span style="font-size:13px;color:#667085">Anything here can be changed without a developer. One item per line: <b>what | who fixes it</b>, add <b>| safety</b> to send it to Chandraji now. Lines starting with ## are group names. The first room group must stay the safety group.</span>
     <b>Room issues (checklist v1)</b>${tx('lsRG',rg,200)}<b>Common areas</b>${tx('lsCG',cg,140)}
     <b>What patients can talk about</b><span style="font-size:12px;color:#667085">Topic | owner | grievance category | options separated by ; | safety: options that count as safety</span>${tx('lsAB',ab,150)}
     <div style="display:flex;gap:8px;justify-content:space-between"><button class="btn" data-px="listreset">Back to the team's list</button><button class="btn pri" data-px="listsave">Save lists</button></div>`;}
  function parseGroups(t){const out=[];let g=null;t.split(/\r?\n/).forEach(l=>{l=l.trim();if(!l)return;if(l.startsWith('##')){g=[l.replace(/^#+\s*/,''),[]];out.push(g);return;}if(!g)return;const p=l.split('|').map(x=>x.trim());if(!p[0])return;const it=[p[0],p[1]||'Housekeeping supervisor'];if(/safety/i.test(p[2]||''))it.push(1);g[1].push(it);});return out.filter(g=>g[1].length);}
  function parseAB(t){return t.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split('|').map(x=>x.trim());const opts=(p[3]||'').split(';').map(x=>x.trim()).filter(Boolean);const row=[p[0],p[1]||'Nursing in-charge',p[2]||'Other',opts.length?opts:[p[0]]];const sf=(p[4]||'').replace(/^safety:\s*/i,'').split(';').map(x=>x.trim()).filter(Boolean);if(sf.length)row.push(sf);return row;});}
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-px],[data-ack],[data-pxclose]');if(!t)return;
    const d=t.dataset;
    if(d.pxclose){if(d.pxclose==='1'&&e.target!==t)return;document.getElementById('cm').innerHTML='';return;}
    if(d.ack){const a=ST.saf.find(x=>x.id===d.ack);if(a){a.ack=true;a.ackAt=Date.now();ST.log.unshift({t:Date.now(),patient:a.patient,room:a.room,kind:'log',text:'Safety concern taken by Chandraji: '+a.what,src:'Rounds'});store();render();toast('Marked as taken. The repeat alerts have stopped.');}return;}
    if(d.px==='entries')modal('What was logged today',entriesHtml());
    else if(d.px==='people')modal('Entries by patient',peopleHtml());
    else if(d.px==='lists')modal('Edit the checklists',listsHtml(),true);
    else if(d.px==='listsave'){const rg=parseGroups(document.getElementById('lsRG').value),cg=parseGroups(document.getElementById('lsCG').value),ab=parseAB(document.getElementById('lsAB').value);
      if(!rg.length||!cg.length||!ab.length){toast('Each list needs at least one item.');return;}
      const L={RG:rg,CG:cg,AB:ab};applyLists(L);try{localStorage.setItem(LKEY,JSON.stringify(L));}catch(x){}document.getElementById('cm').innerHTML='';render();toast('Lists saved. The next room you open uses them.');}
    else if(d.px==='listreset'){try{localStorage.removeItem(LKEY);}catch(x){}toast('Back to the team\'s list. Reloading.');setTimeout(()=>location.reload(),600);}
  },true);
  /* photo: the drawer gets a camera input when something is wrong */
  const origDrawer=drawer;
  drawer=function(){origDrawer();try{const dr=document.getElementById('dr');const btn=dr&&dr.querySelector('[data-savenext]');if(!btn||S.r.room!=='bad')return;
    const wrap=btn.closest('div').previousElementSibling;if(!wrap||dr.querySelector('#rdPhoto'))return;
    const l=document.createElement('label');l.id='rdPhoto';l.style.cssText='display:flex;flex-direction:column;gap:6px;font-size:13px;padding:0 20px 14px';l.innerHTML='<span style="font-weight:600">Photo of the issue (optional)</span><input type="file" accept="image/*" capture="environment" id="rdFile">'+(S.r.photo?'<span style="color:#067647">Photo added: '+esc(S.r.photo)+'</span>':'');
    wrap.appendChild(l);dr.querySelector('#rdFile').addEventListener('change',function(){if(this.files&&this.files[0]){S.r.photo=this.files[0].name;toast('Photo added.');}});}catch(x){}};
  /* ---- clocks and repeats ---- */
  function tick(){
    let ch=false;const now=Date.now();
    ST.saf.forEach(a=>{if(!a.ack&&now-a.last>=30*M){a.n++;a.last=now;ch=true;}});
    /* a safety grievance repeats the same way until taken */
    ST.ent.forEach(e=>{if(e.kind==='grievance'&&!e.cl&&!e.safety){if(now-e.t0>=3*H&&!e.r3){e.r3=1;ch=true;}if(now-e.t0>=6*H&&!e.r6){e.r6=1;ch=true;}}});
    ST.iss.forEach(i=>{if(i.st==='open'&&!i.safety&&now-i.t0>=2*H&&!i.r2){i.r2=1;ch=true;}});
    if(ch)store();
    if(!document.getElementById('dr').innerHTML&&!document.getElementById('cm').innerHTML)render();}
  setInterval(tick,30000);
  /* two people on the same floor: rooms saved by the other phone show here */
  window.addEventListener('storage',e=>{if(e.key===KEY){load();sync();if(!S.cur)render();}});
  /* offline queue */
  window.addEventListener('offline',()=>{render();});
  window.addEventListener('online',()=>{if(ST.queue.length){const n=ST.queue.length;ST.queue=[];ST.ent.forEach(e=>{e.queued=false;});store();toast(n+' saved while offline: sent now.');}render();});
  /* public feed for Today and Patients */
  window.PXRounds={read:()=>{load();return ST;}};
  render();
})();

</script>
</body></html>
